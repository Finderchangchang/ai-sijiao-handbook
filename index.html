<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>杰哥的 AI 私教 · Demo v2</title>
<style>
:root{
  --bg:#f7f5f0;--paper:#fffdf9;--ink:#1d2129;--sub:#6b7280;--line:#ebe6dc;
  --accent:#e8590c;--accent-soft:#fff1e8;--ok:#2f9e44;--ok-soft:#ebfbee;
  --blue:#1c7ed6;--blue-soft:#e7f5ff;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button{font:inherit;color:inherit}

/* 顶栏 */
.top{height:60px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;flex:none}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.tag{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;width:min(380px,40vw)}
.search input{flex:1;border:none;outline:none;font:inherit;padding:8px 0;background:none}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}
.me{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;background:#fff;flex:none}

.main{display:grid;grid-template-columns:270px minmax(0,1fr) 400px;height:calc(100vh - 60px)}

/* 左：目录 */
.toc{border-right:1px solid var(--line);overflow:auto;padding:20px 12px 30px;background:#faf8f3}
.toc-title{font-size:12px;color:var(--sub);font-family:var(--mono);margin:0 8px 14px;display:flex;align-items:center;gap:6px}
.toc-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ch{margin-bottom:4px}
.ch-head{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;font-weight:600}
.ch-head:hover{background:#f1ede4}
.ch-head.on{background:var(--accent-soft)}
.ch-icon{width:24px;height:24px;border-radius:7px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--accent);flex:none;font-weight:600}
.ch-n{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400;font-family:var(--mono)}
.it{padding:6px 8px 6px 42px;border-radius:9px;cursor:pointer;font-size:13px;color:#495057;position:relative}
.it:hover{background:#f1ede4}
.it.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.it .st{position:absolute;left:26px;top:13px;width:7px;height:7px;border-radius:50%;background:#dee2e6}
.it.seen .st{background:var(--ok)}
.it.on .st{background:var(--accent)}
.it.flash{animation:flash 1.4s}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--accent) inset;background:#ffe8cc}}
.toc-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:auto;font-weight:600}
.badge.pulse{animation:pulse .5s 3}
@keyframes pulse{50%{transform:scale(1.35)}}

/* 中：阅读区 */
.reader{overflow:auto;padding:40px 48px 70px;background:var(--paper)}
.inner{max-width:740px;margin:0 auto}
.crumb{font-size:12px;color:var(--sub);font-family:var(--mono);margin-bottom:16px}
.crumb a{color:var(--accent);cursor:pointer}
.rtitle{font-family:var(--serif);font-size:32px;line-height:1.35;font-weight:800;margin-bottom:14px}
.lead{font-size:16px;color:#495057;line-height:1.9;margin-bottom:20px}
.meta{font-family:var(--mono);font-size:12px;color:var(--sub);padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px;display:flex;gap:12px;flex-wrap:wrap}
.sec{border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:18px;background:#fff}
.sec h2{font-family:var(--serif);font-size:20px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 i{color:var(--accent);font-size:14px}
.sec .body{font-size:15px;line-height:1.9}
.quote{font-size:18px;line-height:1.85;border-left:4px solid var(--accent);padding:2px 0 2px 16px}
.draft{font-family:system-ui,sans-serif;font-style:normal;font-weight:500;font-size:12px;color:#e67700;background:#fff9db;padding:1px 7px;border-radius:5px}
.actbox{background:var(--accent-soft);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.8;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{color:#fff;opacity:.9}
.qchip{border:1px solid var(--line);background:#f8f9fa;border-radius:999px;padding:4px 12px;margin:0 6px 8px 0;cursor:pointer;font-size:13px}
.qchip:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.navbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;font-weight:500}
.navbtn:hover{border-color:var(--accent)}
.navbtn small{display:block;color:var(--sub);font-size:12px;font-weight:400;font-family:var(--mono)}
.navbtn.r{text-align:right;grid-column:2}
.sec.flash{animation:secflash 1.8s}
@keyframes secflash{0%,100%{box-shadow:0 0 0 0 rgba(232,89,12,0)}25%{box-shadow:0 0 0 5px rgba(232,89,12,.3)}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.tile{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.05)}
.tile b{display:block;font-size:15px;margin-bottom:4px}
.tile p{font-size:13px;color:var(--sub)}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvc{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;cursor:pointer}
.lvc:hover{background:#f8f6f1}
.lvc b{display:block;font-size:14px}
.lvc small{color:var(--sub);font-size:12px}
.goalbox{border:1px dashed var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:20px;background:#fffaf5;font-size:15px}
.goalbox span{display:block;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px;background:#fff}
.lrow{display:flex;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:#faf8f3}
.ln{font-family:var(--mono);color:var(--sub);font-size:12px}
.lt{flex:1;font-weight:500}
.ls{font-size:12px;color:#adb5bd}
.lrow.seen .ls{color:var(--ok)}
.emptybox{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--sub);background:#fff}
.gapitem{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff}
.gapitem.fresh{border-color:#ffc9c9;background:#fff5f5}
.gapitem b{display:block}
.gapitem small{color:var(--sub)}
.gapitem .cnt{color:#c92a2a;font-weight:600;margin-right:10px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:20px}
.flow span{background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 10px}

/* 右：陪练聊天 */
.chat{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.chead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff922b,#e8590c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;position:relative;flex:none}
.cav::after{content:'';position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#40c057;border:2px solid #fff}
.cname{font-weight:600}
.csub{font-size:12px;color:var(--sub)}
.modes{margin-left:auto;display:flex;background:#f1ede4;border-radius:9px;padding:3px;flex:none}
.modes button{border:none;background:none;font-size:12px;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--sub)}
.modes button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prog{padding:12px 16px;border-bottom:1px solid var(--line);background:#fffdf9}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.prog-row b{color:var(--ink);font-family:var(--mono)}
.pbar{height:5px;background:#eee;border-radius:99px;margin:6px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.mils{display:flex;gap:6px}
.mil{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 8px;border-radius:9px;background:#f8f9fa;color:#adb5bd}
.mil .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e9ecef;font-size:11px;flex:none}
.mil.got{background:var(--ok-soft);color:var(--ok);font-weight:600}
.mil.got .ic{background:var(--ok);color:#fff}
#msgs{flex:1;overflow:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;background:#fbfaf7}
.msg{display:flex;flex-direction:column;max-width:92%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.bot{align-self:flex-start}
.bubble{padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.msg.me .bubble{background:var(--ink);color:#fff;border-color:var(--ink);border-bottom-right-radius:4px}
.msg.bot .bubble{border-bottom-left-radius:4px}
.bubble p+p{margin-top:7px}
.bubble p:empty{display:none}
.bubble p b{color:var(--accent);font-weight:600}
.retr{font-size:12px;color:var(--sub);margin-bottom:6px;display:flex;flex-direction:column;gap:4px}
.retr.miss{color:#c92a2a}
.hit{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;font-size:12px;background:var(--blue-soft);color:#1864ab;border:1px solid #d0ebff;border-radius:8px;padding:5px 10px;cursor:pointer}
.hit:hover{border-color:var(--blue)}
.hit em{font-style:normal;font-weight:600;flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.act-btn{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.act-btn.primary{background:var(--accent);color:#fff}
.act-btn:disabled{opacity:.35;cursor:default}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#adb5bd;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.ctx{display:none;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding:8px 14px 0;border-top:1px solid var(--line)}
.ctx.on{display:flex}
.ctx b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ctx button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px;flex:none}
.ctx button:hover{border-color:var(--accent);color:var(--accent)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.sug{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.sug:hover{border-color:var(--accent);color:var(--accent)}
.inbar{display:flex;gap:8px;padding:10px 14px 6px}
#inp{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
#inp:focus{border-color:var(--accent)}
#send{padding:0 18px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.fine{font-size:11px;color:#9aa0a6;padding:0 14px 10px}

/* 频道切换 */
.chans{display:flex;gap:2px;background:#f1ede4;border-radius:10px;padding:3px;flex:none}
.chans button{border:none;background:none;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--sub)}
.chans button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
body.camp .chat,body.camp .search{display:none}
body.camp .main{grid-template-columns:320px minmax(0,1fr)}
.ch-icon.w{width:auto;min-width:24px;padding:0 5px;font-size:11px}
.it .tm{display:block;font-family:var(--mono);font-size:11px;color:#adb5bd;font-weight:400}
.who{font-size:11px;border-radius:5px;padding:1px 7px;background:#f1ede4;color:#495057;margin-left:6px;font-weight:500;white-space:nowrap}
.who.y{background:#fff0f6;color:#c2255c}
.sec.todo{opacity:.6;border-style:dashed}
.fixbox{background:#fff9db;border:1px solid #ffe066;border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.8;color:#5c3c00;margin-bottom:18px}
.fixbox b{color:#e67700}
.it .fx{color:#e67700;font-size:11px;margin-left:4px}
.jscat{font-weight:700;margin:16px 0 8px;color:var(--accent)}
.jsc{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:#fff}
.jsc summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.jsc summary span{color:var(--sub);font-size:13px}
.jsm{font-size:13px;color:var(--sub);margin:8px 0}
.jsp{white-space:pre-wrap;font-family:inherit;font-size:13px;background:#faf8f3;border-radius:8px;padding:10px 12px;margin:0 0 8px;line-height:1.8}
.lead1{font-size:15px;color:#495057;line-height:1.8;margin:-4px 0 16px}
.posterbox{padding:12px 18px}.posterbox summary{cursor:pointer;font-weight:600;color:var(--sub);font-size:14px}.posterbox summary em{font-style:normal;color:#e67700}
.posterbox .quote{margin-top:12px;font-size:15px}
.ch.closed .it,.ch.closed .sub{display:none}
.caret{margin-left:6px;border:none;background:none;cursor:pointer;color:var(--sub);font-size:12px;padding:0 4px}
.sub{margin:2px 0 6px 40px;border-left:2px solid var(--line);padding-left:6px}
.subi{font-size:12.5px;color:#868e96;padding:4px 8px;border-radius:6px;cursor:pointer;line-height:1.5}
.subi.l2{padding-left:20px;font-size:12px}
.subi:hover{color:var(--ink);background:#f1ede4}
.subi.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.secnav{display:none}
#tocbar{display:none}
[id^="sx-"]{scroll-margin-top:16px}
.verbar{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.verbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12px;color:var(--sub)}
.verbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.verbar span{font-size:12px;color:var(--sub)}
.sec.reveal{border-color:#d0ebff;background:#f5fbff}
.sec.reveal h2 i{color:var(--blue)}
.rv{padding:8px 0;border-bottom:1px solid #e3f1fc}.rv:last-child{border-bottom:none}
.rv b{display:block;font-size:15px}.rv p{font-size:15px;line-height:1.8;color:#343a40}
.shotimg{margin:10px 0 16px}
.shotimg img{display:block;max-width:100%;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.shotimg figcaption{font-size:12px;color:var(--sub);margin-top:6px;text-align:center}
.ql{padding-left:22px;font-size:15px;line-height:2}
.stp{display:flex;gap:12px;margin-bottom:4px}
.stp>b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;margin-top:4px}
.stp>div{flex:1;font-size:15px;line-height:1.85}
.shot{border:1px dashed #ced4da;border-radius:10px;padding:14px;text-align:center;color:#adb5bd;font-size:12px;margin:8px 0 14px;background:#fafafa}
.pit{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.75}
.pit:last-child{border-bottom:none}
.pit>div:first-child{font-weight:600}
.dl{list-style:none;font-size:15px;line-height:2}
.dl li::before{content:'☐ ';color:var(--ok)}
.ex{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px;background:#fcfbf8}
.ex h3{font-size:15px;margin-bottom:8px}
.ex table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.7}
.ex td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
.ex td:first-child{width:96px;color:var(--sub);white-space:nowrap}
details.notes summary{cursor:pointer;font-weight:600;color:var(--sub)}
details.notes ul{margin-top:10px;padding-left:20px;font-size:14px;line-height:1.9;color:#495057}
@media(max-width:900px){.pit{grid-template-columns:1fr;gap:2px}}
.phr{display:inline-block;border:1px solid var(--line);background:#f8f9fa;border-radius:999px;padding:4px 12px;margin:0 6px 8px 0;font-size:13px;font-family:var(--mono)}

@media(max-width:1180px){.main{grid-template-columns:220px minmax(0,1fr) 340px}body.camp .main{grid-template-columns:260px minmax(0,1fr)}.reader{padding:28px 26px 60px}.tiles{grid-template-columns:1fr}.lvgrid{grid-template-columns:1fr}}
@media(max-width:900px){body.camp .reader{overflow:visible}body.camp #tocbar{display:flex;gap:6px;align-items:center;width:100%;border:none;border-bottom:1px solid var(--line);background:#faf8f3;padding:10px 14px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer;text-align:left}body.camp #tocbar b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}body.camp .toc{display:none;max-height:none}body.camp.tocopen .toc{display:block}body.camp .secnav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;margin:0 0 12px;border-bottom:1px solid var(--line);scrollbar-width:none}body.camp .secnav::-webkit-scrollbar{display:none}.secnav button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--sub);cursor:pointer}.secnav button.on{background:var(--accent);border-color:var(--accent);color:#fff}body.camp [id^="sx-"]{scroll-margin-top:60px}.top{gap:8px;padding:0 10px}.tag,.me{display:none}.brand{font-size:14px;gap:6px}.logo{width:28px;height:28px}.chans{margin-left:auto}.chans button{padding:5px 8px;font-size:12px}.main,body.camp .main{grid-template-columns:1fr;height:auto}.reader{padding:20px 14px 50px}.sec{padding:16px 14px}.rtitle{font-size:26px}.pit{grid-template-columns:1fr}.toc{max-height:280px;border-right:none;border-bottom:1px solid var(--line)}.chat{height:85vh;border-left:none;border-top:1px solid var(--line)}.search{display:none}}
/* 本节导航列：整屏三栏，半屏两栏（目录收进按钮），手机隐藏 */
.pnav{display:none}
body.camp.haspnav .main{grid-template-columns:290px 190px minmax(0,1fr)}
body.camp.haspnav .pnav{display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fcfbf8;overflow:auto;padding:20px 10px 14px}
.pn-title{font-size:12px;color:var(--sub);font-family:var(--mono);margin:0 8px 10px;display:flex;align-items:center;gap:6px}
.pn-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pnav .subi{font-size:13px;padding:6px 10px}

    {t:'把讲师发的「工作区模板」文件夹整个复制到电脑上（例如 D 盘），改名为你的公司名，例如「陶陶居AI工作区」。实训营助手已经放在里面的 .agents\\skills\\ai-camp 下（它是一个 skill，也就是一份教 AI 怎么干活的说明书），「资料」文件夹也建好了，不用自己建。Mac 上以「.」开头的文件夹默认看不到，也不好新建，所以由讲师提前建好。'},
    {t:'在 Codex 里点「新建项目」，选刚才那个文件夹。弹出「信任此文件夹吗？」，点「信任文件夹」。',shot:'新建项目、选文件夹、信任',img:['assets/camp/a1-6a.png','assets/camp/a1-6b.png','assets/camp/a1-6c.png']},
    {t:'在输入框说「用实训营助手（ai-camp）开始」。一定要点名实训营助手：只说「开始」两个字，它可能听不出你要上这门课（10-24 实测就没认出来）。它会建好进度表，然后问你公司全称和城市，这就进到下一节了。',shot:'说用实训营助手（ai-camp）开始',img:['assets/camp/a1-7a.png','assets/camp/a1-7b.png']}],
   pits:[
    ['商店里搜到两个 ChatGPT','装没有 Classic 的那个；按公众号那篇的说法，显示「此产品在你的市场中未提供」的是旧版（开课前在中国区商店再确认一次）'],
    ['登录时弹「电话号码是必填项」','网络稳定一般不会弹；弹了就用短信或 WhatsApp 验证，不行先用主办方的备用账号上课'],
    ['它回「你想先做什么？」，没按实训营的路子走','你可能只说了「开始」。再说一遍「用实训营助手（ai-camp）开始」；还不行，检查 ai-camp 是不是放在 .agents\\skills\\ 下面，新开对话再说'],
    ['后面它说没有权限改文件','项目没有设成信任：在项目设置里改成信任，或叫助教'],
    ['提示额度不够','会员可能没到账，找助教查充值；先用主办方备用账号']],
   done:['ChatGPT 桌面版里能切到 Codex','工作区文件夹建好了，实训营助手放进去了','说「用实训营助手（ai-camp）开始」后，它问你公司全称和城市','你知道以后怎么更新 Codex'],
   notes:['时长 30 分钟：开场 5 分钟（两天带走 9 样东西）→ 装桌面版并登录 10 分钟 → 讲怎么更新 3 分钟 → 放 skill 包、建项目、点信任 10 分钟 → 说「用实训营助手（ai-camp）开始」2 分钟','课前只注册账号、充好会员，软件现场装；30 人同时下载，备好讲师热点','讲师现场发「工作区模板」（U 盘或群文件）：里面已建好 .agents\\skills\\ai-camp 和空的「资料」文件夹','对应结营 01：知道以后怎么升级 Codex']}},
  {id:'a2',no:'02',step:'1',t:'让 AI 读懂你的公司，建企业知识库',poster:'让 AI 读懂你的电脑 —— 分析电脑、文件与工作环境，建立专属 AI 企业知识库',fix:'海报写「读懂你的电脑」。实际只读你交的资料和网上的公开信息，不扫整台电脑',do:'AI 先上网查你的公司，再看你交的资料，整理成一份「企业档案」；你核对一遍，错的当场改。',who:'柳',time:'09:30–10:20',body:{
   quick:['把课前交的 3 样资料（价目表、常见问题、照片）拖进「资料」文件夹','在 Codex 里说出公司全称和城市','等 1 分钟左右，它会告诉你查到了什么','它请你核对，哪里不对直接说','打开「企业档案」看一眼，每条后面都写了从哪来的'],
   why:'AI 不认识你的公司，不给它资料，它只能瞎猜。这一步就像给新员工一本公司手册：它上网查一遍，再加上你交的资料，整理成一份「企业档案」，你拍板。后面做官网、小工具、话术，事实都从这份档案里拿；档案对了，后面就不会错。',
   reveal:[
    ['「企业知识库」「企业档案」是什么？','就是工作区里的一个文件，叫「企业档案」，写着公司是谁、卖什么、多少钱、怎么联系。海报说的「企业知识库」指的就是它。'],
    ['它从哪查的？','官网、公众号、地图和点评、工商信息、新闻。每条后面都写了出处，能点开核对。'],
    ['海报写「读懂你的电脑」，真的会扫电脑吗？','不会。它只看你放进「资料」文件夹的东西和网上公开的信息，不翻电脑里别的文件。'],
    ['为什么非要老板核对？','AI 会搜到同名的公司，或者网上的旧信息。价格、电话这些，以老板说的为准。'],
    ['网上搜不到怎么办？','小店很常见。让老板对着电脑说 3 分钟：做什么、在哪、多少钱，它照样能整理出来。'],
    ['它还顺手做了什么？','生成一份「工作区规矩」（文件名 AGENTS.md）：以后每一步只用档案里的事实、不编价格。老板不用管它。']],
   say:['我的公司是 XXX，在 XX 市。','电话不对，是 XXX。','价格不对，是 XXX 元。','同名的那几家都不是，我们是 XX 区那家。','网上搜不到我们，我说一下：……','还有哪些没查到？列给我。'],
   steps:[
    {n:'放资料',t:'打开工作区里的「资料」文件夹（工作区就是你电脑上那个公司文件夹），把价目表、常见问题、几张照片拖进去。价目表是拍的照片也行。',shot:'资料文件夹',img:'assets/camp/a2-1.png'},
    {n:'说公司名',t:'回到 Codex，说出公司全称和城市，比如「陶陶居，在广州」。',shot:'回答公司名和城市',img:'assets/camp/a2-2.png'},
    {n:'等它查',t:'等它查。一般 1 分钟左右，慢的四五分钟。'},
    {n:'看查到什么',t:'它先告诉你查到了什么。比如陶陶居，它查到：1880 年创立，总店在第十甫路，还有总店电话。右边能看到它查了哪些网页。',shot:'AI 查到的信息',img:'assets/camp/a2-4.png'},
    {n:'核对',t:'它会问你几处拿不准的，比如「你代表整个品牌，还是某一家门店」。对的不用管，不对的直接说，它当场改。',shot:'核对和纠正',img:'assets/camp/a2-5.png'},
    {n:'看档案',t:'打开「企业档案」看一眼：每条后面都写了从哪来的，查不到的写着「待补」。',shot:'企业档案',img:'assets/camp/a2-6.png'}],
   pits:[
    ['网上几乎搜不到','小店很常见。用微信输入法按住说 3 分钟：做什么、在哪、多少钱、客户常问什么'],
    ['搜到好几家同名的','它会列出来，你说是哪家'],
    ['它写的价格和你的不一样','以你交的价目表为准，直接告诉它正确价格'],
    ['档案里好多「待补」','它不敢编才写待补。挑要紧的说给它，其余课后补'],
    ['等了 10 分钟没动静','举手叫助教'],
    ['写进了别人家的事','直接说「这条不是我们，删掉」']],
   done:['档案里自家的价格、电话、地址，你核对过，是对的','每条后面都写了从哪来的','查不到的写着「待补」，没有编的'],
   notes:['时长 50 分钟：讲师大屏演示 10 分钟（用悦姐的公司；前一天先做一遍留个备份，现场再演示一遍）→ 学员一起做 25 分钟（AI 查一般 1 分钟左右，其余时间核对）→ 抽 2 人说说 AI 查到了哪些自己都忘了的信息 10 分钟 → 收尾 5 分钟','讲这几句：「AI 不认识你，它只会猜。」「档案是后面所有东西的地基。」「网上搜不到不丢人，正好说明你需要官网。」「AI 说的你都要核一遍。」','10-24 实测（GPT-6 Luna，陶陶居）：查资料加整理档案 44 秒','课前：助教检查每人的 3 样资料交齐；30 人同时查会慢，慢的人先看大屏','常见：学员照抄讲师演示里的价格 → 删掉换自己的；整份都是待补 → 让他口述 3 分钟','对应结营 01：能答对自家价格；「改一项信息、同步到官网」在 D2 上午 04 上线时练']}},
  {id:'a3',no:'03',step:'2',t:'从 0 搭建第一个官网',poster:'从 0 搭建第一个官网 —— 让自己的产品和业务拥有独立展示入口',do:'说清给谁看、看完做什么、喜欢什么样 → 出初稿（图片先用你交的照片）→ 指挥它改一版 → 手机尺寸看一遍',who:'柳',time:'10:30–11:20',body:{
   quick:['说「下一步」','回答 3 件事：给谁看、看完让他干什么、喜欢什么样（有喜欢的网站就发链接或截图）','等它出初稿，右边直接能看','挑一处最不满意的，说清改哪、改成什么样','手机宽度看一遍，按钮都点一下'],
   why:'官网是你在网上的门面：客户听说你、搜到你，最后都会落到这一页，要一眼看懂你是谁、做什么、下一步找谁。今天的官网不花钱建站，Codex 照着你的档案直接写出来，样子你说了算。好不好看是你的口味，事实对不对按档案来：价格、电话、地址只从档案里取，档案里没有的就不放。',
   say:['做官网，给 XX 的客户看，看完让他打电话预约。','我喜欢这个网站的配色和留白：（贴链接或截图）','首屏的按钮太靠下，手机上一眼看不到，挪到标题下面。','这个颜色太暗，换成我们招牌上的红色。','这张图不是我们店，删掉。','切到手机宽度看一下，有没有字挤在一起、按钮点不了。'],
   steps:[
    {t:'核对完档案，它一般会接着问你 3 件事（没问就说「下一步」）：给谁看；看完希望他做什么（打电话、到店、留资料）；喜欢什么样。没想法就说「你先按档案做，我再改」。新版 ChatGPT 会用选择题卡片问，点一个选项就行，也可以自己写。',shot:'回答 3 个问题',img:'assets/camp/a3-1.png'},
    {t:'有喜欢的网站，直接把链接或截图发给它，再说一句喜欢的是哪一点：颜色、排版、照片的感觉。它只学样子，不抄人家的内容。',shot:'发参考网站'},
    {t:'等它出初稿，右边预览直接能看。图片先用你交的照片；没有照片的位置先用色块，下午再用 AI 生成配图。10-24 实测：从回答完 3 个问题到出官网，用了 3 分半。',shot:'初稿在右侧预览',img:'assets/camp/a3-2.png'},
    {t:'看首屏：你是谁、做什么、下一步点哪里，这三件事一眼能看到吗？下图 ① 是谁、② 做什么、③ 下一步点哪里。',shot:'首屏三件事',img:'assets/camp/a3-4.png'},
    {t:'挑一处最不满意的，说清改哪、哪里不对、想改成什么样。一次只改一处，改完再说下一处。',shot:'改一处',img:['assets/camp/a3-5a.png','assets/camp/a3-5b.png']},
    {t:'让它切到手机宽度看一遍，你自己也点一遍按钮：电话能拨、地址对、没有字挤在一起。其实它自己会先开浏览器按手机宽度看一遍，再告诉你检查过了。',shot:'手机宽度检查',img:['assets/camp/a3-6.png','assets/camp/a3-3.png']}],
   pits:[
    ['说「不好看」，它改了一堆还是不对','说具体点：哪个位置、哪里不对、想改成什么样，一次只改一处'],
    ['页面上出现了我没给过的价格或评价','直接说「这条档案里没有，删掉」，它只能用档案里的事实'],
    ['页面打开很慢','多半是图片太大，让它把图片压缩一下，加起来别超过 1MB'],
    ['改着改着把之前好的地方也改没了','说「退回上一版」，再只改那一处'],
    ['想加会员登录、在线支付','今天不做，记进课后清单'],
    ['参考网站的内容被搬过来了','说「只学样子，内容全部换成我的档案」']],
   done:['首屏一眼能看出：你是谁、做什么、下一步点哪里','页面上的价格、电话、地址和档案一致，没有编出来的内容','按你的意思改过至少一处','手机宽度打开不乱，按钮都点得动'],
   notes:['时长 50 分钟：讲 5 分钟（先定给谁看、看完干什么，再定长什么样）→ 讲师演示 10 分钟 → 学员做 30 分钟（AI 出初稿单人实测 3 分半，30 人同时做会慢一些，其余时间改）→ 抽 1 人展示改前改后 5 分钟','讲这几句：「样子你说了算，事实档案说了算。」「说不出好看在哪，就拿一个你喜欢的网站来。」「一次只改一处。」','做法：Codex 照档案直接写单页网站，不套精装生成器，学员电脑不用装 Node。skill 里只留护栏：事实只从档案取、图片压缩、手机检查、按钮能点；小工具入口等下午做好了再加，不放空链接','常见：整节都在挑颜色 → 先把事实和主按钮做对，细调放到下午；学员说「要高大上」→ 追问是哪个网站、哪一点','对应结营 02：手机 4G 能打开（D2 上线后验）']}},
  {id:'a4',no:'04',step:'3',t:'提前布局 GEO 搜索',poster:'提前布局 GEO 搜索 —— 让官网更容易进入 AI 搜索与推荐结果',fix:'现场能做到的是「内容做好、挂上官网」；被 AI 搜索收录和推荐要等几周，不当场保证；今天挂在 github.io 上是练手，国内的 AI 能不能读到没把握，要稳定被读到，课后迁到国内服务器并备案',do:'先问豆包、DeepSeek，截图留底 → 生成常见问答和品牌介绍 → 挂到官网上',who:'悦姐 + 柳',time:'11:20–12:00',body:{
   quick:['说「下一步」，AI 先给你 3 个客户会问的问题','拿手机把这 3 个问题问一遍豆包、DeepSeek，截图留底','同时 AI 在写常见问答和一篇品牌介绍','核对答案，没依据的删掉','它挂到官网上，你手机看一眼'],
   why:'以后越来越多客户不搜百度，直接问 AI：「XX 市哪家早茶适合带爸妈？」AI 回答时会去读网上的信息。你的信息越清楚、越像在回答客户的问题，越容易被它读懂、说对。GEO 就是做这件事：把客户会问的问题和有依据的答案写好，挂到你的官网上。先截一张「优化前」的图，以后才知道有没有变化。收录和推荐要等几周，今天做的是准备工作，不保证排名。',
   say:['下一步。','截图放好了，在「GEO/优化前截图」里。','这条答案不对，我们周末不营业。','这个问题我们答不了，删掉，别放到网上。','把常见问答放到官网首页下面。','品牌介绍再短一点，三句话说清是谁、在哪、做什么。'],
   steps:[
    {t:'说「下一步」，它先照档案写 3 个客户会问 AI 的问题，比如「广州哪家早茶适合带爸妈」「XX 一般多少钱」「XX 提供哪些服务」。它会问你：等你截完图再继续，还是先继续、截图课后补。',shot:'3 个留底问题',img:'assets/camp/a4-1.png'},
    {t:'拿出手机，把这 3 个问题分别问豆包和 DeepSeek，截图存进工作区的「GEO/优化前截图」（手机截图用微信「文件传输助手」发到电脑，再拖进去）。这是你的底，几周后再问一遍对比。',shot:'豆包的回答截图'},
    {t:'你截图的时候，它在写两样东西：一份常见问答，每条答案都有档案依据；一篇品牌介绍，写清是谁、在哪、做什么、适合谁、怎么联系。',shot:'常见问答清单'},
    {t:'你看一遍答案：不对的说哪里不对；没依据的让它删。宁可少，不要编。',shot:'核对答案'},
    {t:'它把常见问答挂到官网上，并顺手做好给搜索引擎看的几样文件。网址先用占位的，明天上线后换成真的。',shot:'官网上的常见问答',img:'assets/camp/a4-5.png'},
    {t:'手机宽度看一眼问答区，排版不乱就行。它还会写一份「分发清单」：品牌介绍以后可以发到哪些平台，课后你自己发。10-24 实测这一步用了 2 分 47 秒。',shot:'GEO 完成汇报',img:'assets/camp/a4-3.png'}],
   pits:[
    ['手机上没有豆包或 DeepSeek','用讲师大屏的截图，注明不是你自己问的；或者课后补'],
    ['答案写得很好看，但我们其实做不到','删掉。答案只能写档案里有依据的'],
    ['问答只有几条，凑不够','不用凑，有几条写几条；缺的资料记下来课后补'],
    ['问了 AI 还是搜不到我们','正常。今天只是把内容准备好，上线后要等几周才可能被收录'],
    ['官网首页被问答撑得很长','让它把问答做成点开才展开，或者单独放一页']],
   done:['工作区「GEO/优化前截图」里有 3 个问题的截图','官网上挂了常见问答，每条都能在档案里找到依据','有一篇品牌介绍，三句话说得清你是谁','页面上没有「保证排名」「第一」这类说法'],
   notes:['时长 40 分钟：悦姐主讲 GEO 是什么、为什么现在就要做；柳在大屏同步跑 skill，学员跟着跑','悦姐的接口：开讲前每人已有官网和企业档案；讲完每人有一个「GEO」文件夹（基线问题、优化前截图、常见问答、品牌介绍、分发清单）','讲这几句（建议，悦姐定）：「以后客户先问 AI，再找你。」「答案有依据，AI 才敢引用。」「今天是准备，不是保证排名。」','常见：学员要求写「广州第一」→ 不写，档案里没有出处；没截图 → 记「留底待验收（课后补截图）」，不影响往下做','实测发现：AI 出的 3 个留底问题都带了品牌名。讲师要提醒学员至少改 2 个不带品牌名的，例如「广州哪家早茶适合带爸妈」，这样才测得出客户还不知道你时，AI 会不会推荐你','对应结营 02：官网上有常见问答；有 GEO 优化前截图']}}]},
 {id:'d1pm',icon:'1下',name:'D1 下午 · 做出能引流的钩子产品',full:'DAY 1 下午｜做出能引流的 AI 钩子产品',goal:'下午结束：一个能运行、能展示、能接流量的 AI 产品',items:[
  {id:'b1',no:'01',t:'看懂什么是真正的 AI 钩子产品',poster:'看懂什么是真正的 AI 钩子产品 —— 找到用户愿意点击、体验和转发的产品切口',do:'讲：送客户一个好用的小东西，他用完顺手留个电话。3 个案例、5 种小工具类型',who:'柳',time:'13:30–13:50',body:{
   quick:['记住一句话：送客户一个好用的小东西，他用完顺手留个电话','看 3 个案例','从 5 种类型里挑一种最适合你的','想好：你的客户最常问你哪一句'],
   why:'客户不会因为你有官网就打电话，得先给他一个「用得上」的东西：算一下要花多少钱、测一下适合哪种、生成一份清单。他用完觉得有用，顺手就把电话留了。这就是钩子产品，跟「免费测肤」「9.9 元体验课」是一回事，只不过现在用 AI 一小时就能做出来。今天只做小的：一个人、一件事、一个结果，最后一步留电话。',
   say:['我是做 XX 的，客户最常问我「……」。帮我想 3 个能送给客户的小工具，每个说清：谁用、用完得到什么、最后让他做什么。'],
   exTitle:'3 个案例',
   examples:[
    {h:'① 餐饮 · 早茶聚餐预算助手（计算 / 报价）',rows:[['谁用','打算来聚餐的客户'],['问什么','几个人、什么场合、大厅还是包间'],['得到什么','建议点几套、大概花多少钱'],['最后','留电话订位']]},
    {h:'② 教培 · 孩子该报哪个班（测评 / 诊断）',rows:[['谁用','孩子要报班的家长'],['问什么','几年级、现在大概多少分、每周能上几次'],['得到什么','推荐哪个班，附一句理由'],['最后','预约一节试听']]},
    {h:'③ 工厂 · 询价单生成器（生成器）',rows:[['谁用','来询价的采购'],['问什么','要什么产品、规格、数量、交期'],['得到什么','一份整理好的询价单'],['最后','提交给业务员报价']]}],
   steps:[
    {t:'听讲师讲这一句：送客户一个好用的小东西，他用完顺手留个电话。'},
    {t:'看上面 3 个案例：每个都只问 3 个问题，给一个结果，最后一步留电话。'},
    {t:'认识 5 种类型：测评 / 诊断（测一下适合哪种）、计算 / 报价（算一下要多少钱）、生成器（生成一份清单或方案）、问答助手（常见问题随时问）、预约 / 登记（填个时间来店里）。'},
    {t:'想一想：你的客户最常问你哪一句？在哪一步犹豫？那里就是你的钩子。'},
    {t:'想不出来，就把「照着说」那句发给 Codex，让它帮你想 3 个，下一节挑一个做。'}],
   pits:[
    ['我想做会员系统、小程序商城','今天只做小的：一个人、一件事、一个结果。大需求记进课后清单'],
    ['想不出客户会用什么','回想客户打电话最常问的第一句话，就从那句话做'],
    ['担心结果不准，客户觉得被骗','结果只用档案里的价格和规则，页面写清「仅供参考，以实际为准」']],
   done:['能用一句话说出钩子产品是什么','从 5 种类型里挑好了你要做的那一种','想好了客户最常问你的那句话'],
   notes:['时长 20 分钟，以讲为主；最后几分钟让学员把「照着说」那句发给 Codex','3 个案例做成 3 页课件，每页放一张真页面截图；餐饮那个 10-05 实测做过','讲这几句：「先送，再要。」「一个人、一件事、一个结果。」「最后一步一定是留电话。」','对应结营 03 的前半段']}},
  {id:'b2',no:'02',step:'4、5',t:'实战搭建自己的钩子产品',poster:'实战搭建自己的钩子产品 —— 从一个想法开始，现场做出可运行的产品原型',do:'AI 问 3 个问题，出说明书 → 你点头 → 生成小工具 → 复制飞书客户表模板，把表单接到最后一步 → 同桌扮顾客走一遍',who:'柳',time:'13:50–15:00',body:{
   quick:['说「下一步」，告诉 AI 你要做什么小工具：谁用、用完得到什么、最后让他做什么','看它写的说明书，对了就说「行」','说「下一步」，等它生成小工具','复制飞书客户表模板，把表单链接发给它，接到最后一步','同桌当客户点一遍，你在旁边不许解释'],
   why:'上一节想好了送什么，这一节真做出来。先写说明书再动手，是为了不跑偏：说明书写清谁用、问几个问题、给什么结果、最后去哪，你点了头 AI 才开工。做完让同桌当客户试，是因为你自己知道怎么点，客户不知道；他卡住的地方，就是要改的地方。',
   say:['下一步。','给来聚餐的客户用，用完知道该点几套、大概花多少钱，最后留电话订位。','行。','这是我的客户表单链接：（粘贴链接），接到最后一步。','13 人以上别报价，提示打电话找店长。','结果页加一句「仅供参考，以门店实际为准」。'],
   exTitle:'2 个操作示例',
   examples:[
    {h:'示例 1 · 餐饮 · 早茶聚餐预算助手（10-05、10-24 两次实测）',rows:[['你说的','谁用：打算来聚餐的客户；用完得到：该点几套、大概多少钱；最后：留电话订位'],['说明书','类型「计算 / 报价」；算法：每 2 人估 1 套、向上取整，乘以档案里的 168 元一套；9 人以上不报价，由门店确认'],['做出来的样子','选「5 人」→ 约需 3 套，参考 504 元，下面写明「课程演示估算，不是门店正式报价」'],['接表单','最后一步「复制订位摘要」「打开飞书客户表单」：客户把摘要粘进表单，再留姓名电话'],['实测','10-24 用 GPT-6 Luna：生成那一步用了 10 分 19 秒，它自己核对了 2–8 人的算法和手机、电脑两种宽度']]},
    {h:'示例 2 · 教培 · 孩子该报哪个班（同样步骤设计，未实测）',rows:[
     ['回答 3 个问题','谁用：孩子要报班的家长；用完得到：适合哪个班、为什么；最后：预约一节试听'],
     ['说明书','类型「测评 / 诊断」；问 3 个问题：几年级、现在大概多少分、每周能上几次；班型和价格只用档案里的'],
     ['预期样子','选「四年级、80 分左右、每周 2 次」→ 推荐提高班，附一句理由；档案里没有的班型不推荐，提示咨询老师'],
     ['接表单','最后一步「预约试听」跳到飞书客户表单'],
     ['注意','不写「保证提分」这类承诺；只问成绩和时间，不收孩子的身份信息']]}],
   steps:[
    {t:'说「下一步」。它可能先推荐一个方向（10-24 实测推荐的是「到店问答助手」）；不想要，就在卡片最下面自己写：谁用、用完得到什么、最后让他做什么，再点发送。',shot:'说出你要的小工具',img:'assets/camp/b2-1.png'},
    {t:'它写好说明书（类型、问几个问题、结果长什么样、最后去哪），再把关键规则用选择题请你确认，例如「每 2 人估 1 套」。对了就选「按这个」，不对直接写。',shot:'确认算法',img:'assets/camp/b2-2.png'},
    {t:'它会问客户表单从哪来。打开助教发的「客户表模板」，复制一份到自己的飞书，分享设成「获得链接的互联网用户都能填写」，把表单链接贴给它，说「接到最后一步」。',shot:'贴上客户表单链接',img:['assets/camp/b2-4.png','assets/camp/b2-4b.png']},
    {t:'它开始生成小工具，10-24 实测用了 10 分钟左右，等的时候可以顺便休息。它会自己按手机和电脑两种宽度检查、核对算法，并在官网上加好入口。它不会替你提交表单，真提交留到明天上线后用手机验。',shot:'小工具做完的汇报',img:'assets/camp/b2-5.png'},
    {t:'自己点一遍：选人数，点「计算套餐预算」。看结果对不对（下图 5 人 → 3 套、504 元）、有没有写明「不是正式报价」、最后能不能复制摘要、打开客户表单。',shot:'算出来的结果',img:'assets/camp/b2-3.png'},
    {t:'换同桌当客户，从头点到尾。你在旁边看，不许解释；他卡住的地方，告诉 AI 改。',shot:'同桌互检'}],
   pits:[
    ['AI 问的问题太多，客户嫌烦','说「不影响结果的问题都删掉，最多 3 个」'],
    ['结果里冒出档案里没有的价格','说「只用档案里的价格，没有的写请咨询」'],
    ['点到最后没跳到表单','检查表单链接是不是复制完整了，让它重新接一遍'],
    ['表单提交了，客户表里没看到','今天先不管，明天上线后用手机再验一次'],
    ['同桌说看不懂结果','让 AI 把结果改成一句大白话加一个数字'],
    ['想做成会员系统','缩成小版本，原需求记进课后清单'],['客户说表单打不开、填不了','表单分享设置改成「获得链接的互联网用户都能填写」']],
   done:['说明书你点过头','小工具能从头点到尾，结果只用档案里的价格和规则','最后一步能跳到你自己的客户表单','同桌没靠你解释就用完了'],
   notes:['时长 70 分钟：说明书 15 分钟 → 生成 25 分钟（AI 约 10–12 分钟，等的时候讲互检怎么做，也可以顺便休息）→ 接表单 10 分钟 → 同桌互检 15 分钟 → 收尾 5 分钟','课前：助教做好「客户表模板」，开课时发链接，学员复制一份到自己的飞书','讲这几句：「先写说明书，再动手。」「你会点不算，客户会点才算。」','对应结营 03：别人能用完，提交的信息进了客户表（真提交入库在 D2 上线后验）']}},
  {id:'b3',no:'03',t:'接入真实 AI 能力',poster:'接入真实 AI 能力 API —— 实战接入生图 API、生视频 API 与更多 AI 功能',fix:'海报写「生图 API、生视频 API」。现场：图用 Codex 自带的直接生成；视频是给 Codex 装 ChatCut 插件，把照片剪成一条简单短视频（是剪辑，不是凭空生成视频）',do:'Codex 直接生成一张图 → 给 Codex 装上 ChatCut 插件 → 用照片和这张图剪一条 15 秒竖版短视频（字幕 + 音乐，不加复杂特效）→ 导出',who:'柳',time:'15:00–15:40',body:{verify:'ChatCut 这一段还没在我们的电脑上实测：装插件、登录、免费额度、中文字幕和导出下载，开课前讲师要走通一遍。官网给的英文安装口令是 /goal Read chatcut.io/chatgpt to install the ChatCut plugin and set up a new task for me.',
   quick:['让 Codex 生成一张图：说清用在哪、什么风格','给 Codex 装 ChatCut 插件，第一次登录 ChatCut 账号','让它用你的照片和这张图，剪一条 15 秒竖版短视频','加字幕和音乐，导出，手机上看一遍'],
   why:'AI 不只会聊天写字，还能直接出图、剪视频。这一节体验两样：图片，Codex 自己就能生成，不用另找工具；视频，给 Codex 装一个叫 ChatCut 的插件，它就会剪了。这就是「接入外部 AI 能力」：Codex 负责听你说话、拿主意，ChatCut 负责剪辑。以后想加别的能力也是这个路子：找到插件，装上，用嘴指挥。',
   say:['给我的小工具首屏生成一张图：一桌早茶，暖色，不要文字，不要真人。','这张太花了，换个干净点的背景。','读一下 chatcut.io/chatgpt，帮我装上 ChatCut 插件。','用「资料」里的照片和刚才那张图，剪一条 15 秒的竖版短视频，配字幕和轻快的音乐，结尾放店名和电话。','字幕放大一点，音乐换个安静的。','导出成 MP4，告诉我文件在哪。'],
   steps:[
    {t:'对 Codex 说要什么图：用在哪（小工具首屏或官网），什么风格，不要文字、不要真人。Codex 自带生图，不用装别的，几十秒出一张（它可能一次多出几张让你挑）。',shot:'Codex 生成的图',img:'assets/camp/b3-1.png'},
    {t:'不满意就说哪里不满意，再出一张。满意了让它压缩好，放进官网或小工具。10-24 实测：一张图约 2.6MB，Codex 往文件夹里存的时候碰到命令长度限制，只能一段段写，花了好几分钟。更快的办法：在对话里右键这张图，选「在资源管理器中打开」或「下载副本」，把图拖进工作区，再说「图在这里，压缩后放到小工具首屏」。',shot:'放进页面的效果和右键菜单',img:['assets/camp/b3-3.png','assets/camp/b3-2.png']},
    {t:'装 ChatCut：在 ChatGPT 桌面版左边栏打开「插件」，搜 ChatCut，点安装；或者把「照着说」里那句发给 Codex，让它帮你装。第一次用要登录 ChatCut 账号（课前注册的免费版）。按 ChatCut 官网的说法，只有桌面版能装插件，网页版和手机版不行。',shot:'插件里找到 ChatCut',img:'assets/camp/b3-4.png'},
    {t:'让它剪：用「资料」里的照片加刚才生成的图，15 秒竖版，配字幕和音乐，结尾放店名和电话。就这么简单，别加特效。',shot:'剪好的时间线'},
    {t:'剪好以后可以接着用嘴改：字幕大小、音乐、图片顺序。',shot:'改字幕或音乐'},
    {t:'导出 MP4，存进工作区，手机上播一遍。',shot:'手机上播放'}],
   pits:[
    ['图里出现乱码文字','说「图里不要任何文字」，字留到网页上再加'],['图生成了，好几分钟还没放进页面','图太大，Codex 正一段段往文件里写，可以等它。急的话右键图片选「在资源管理器中打开」，把图拖进工作区，再让它压缩后放进页面'],
    ['生成的图像真人，或者像别人家的店','删掉重来。生成图只做氛围，不能冒充实拍'],
    ['插件里搜不到 ChatCut','确认用的是 ChatGPT 桌面版；还不行叫助教'],
    ['它说要花 ChatCut 积分，或要上传素材','先停下问助教，不要自己充值。按官网说明，免费版包含基础剪辑和导出（开课前讲师实测确认）'],
    ['视频剪得太花、特效太多','说「只要照片轮播加字幕和音乐，别的都不要」'],
    ['找不到导出的视频','让它告诉你文件在哪；还找不到，就在 ChatCut 网页上打开同一个项目导出']],
   done:['官网或小工具里用上了一张 Codex 生成的图','剪出一条 15 秒左右的竖版短视频，手机能播','能说出「接入外部能力」是怎么回事：装插件、登录、用嘴指挥'],
   notes:['10-24 实测（陶陶居演示）：生图加放进页面一共 9 分半，大部分时间花在把图存进文件夹；教学员右键「在资源管理器中打开」能省几分钟','时长 40 分钟：讲 5 分钟（AI 不只聊天，还能出图、剪视频；插件就是接入外部能力）→ 生图 10 分钟 → 装插件并剪视频 20 分钟 → 收尾 5 分钟','⚠ ChatCut 还没实测。装法、免费额度都来自 ChatCut 官网（2026-10-24 查）：免费版不用绑卡，含基础剪辑和导出、AI 字幕和音乐，网页导出累计 60 分钟。开课前必须在 ChatGPT 桌面版走通一遍，确认中文字幕、导出下载和免费额度','课前：每人注册 ChatCut 免费账号（课前准备 0.3）；讲师备一套演示素材','口径：ChatCut 要花积分、云端渲染、上传私有素材时会先问，助教统一说「先停一下，课上不充值」，实测免费版够不够之后再定口径','对应结营 04：用上了 Codex 生成的图；剪出一条短视频']}},
  {id:'b4',no:'04',step:'8',t:'56 个岗位型 AI 军师',poster:'搭建 56 个岗位型 AI 军师模板 —— 销售、文案、运营、朋友圈等场景随时调用',do:'Codex 读档案写 3 段自家话术 → 打开 56 个岗位军师，挑一个复制到 Codex 用',who:'柳',time:'15:50–16:30',body:{
   quick:['说「下一步」，Codex 读档案写 3 段自家话术：客户留了电话以后，第一句怎么说','在下面的 56 个军师里，找一个你最常用的','点「复制提示词」，粘贴到 Codex，把【】里的换成你的','看它交回来的结果，不满意就说哪里改'],
   why:'客户留了电话，下一句说什么，决定这单成不成。这一节先让 Codex 照你的档案写 3 段自家话术，以后照着说。再给你 56 个「岗位军师」：销售、客服、文案、短视频、私域、店长、招聘、报价……每个军师只干一件具体的事，提示词都写好了，复制粘贴就能用。它们都先读你的企业档案，价格和优惠只用档案里的；规矩里写了不许编，万一编了，按下面「坑」里的办法处理。',
   say:['下一步。','话术里加一段：客户说「我再考虑一下」怎么接。','叫嫌贵应对军师：客户说太贵了，产品是招牌套餐。','这句太客气了，改成我平时说话的口气：……'],
   steps:[
    {t:'说「下一步」。它先问你要哪几段，默认 3 段。10-24 实测默认是：小工具首次回访、问价后没下文、邀请老客回店，每段都有电话版和微信版。',shot:'选话术场景',img:'assets/camp/b4-1.png'},
    {t:'它读企业档案写好话术。每段都是：开场白 → 客户最常见的 3 种回答怎么接 → 收尾 → 不要说什么。实测 1 分半左右。',shot:'写好的话术',img:'assets/camp/b4-2.png'},
    {t:'念一遍，不像你说话的地方直接改，例如「这句太客气了，改成……」。'},
    {t:'往下看「56 个岗位军师」，按分类找一个你最常用的，比如「嫌贵应对军师」。'},
    {t:'点「复制提示词」，粘贴到 Codex，把【客户原话】【产品名】换成你的，发出去。'},
    {t:'它先读档案，再按卡上的步骤干活，交回固定格式的结果，比如 3 个版本的回复。挑一个用，或者让它再改。也可以不复制，直接说「叫嫌贵应对军师」，实训营助手会自己去找这张卡。10-24 实测：说「叫嫌贵应对军师：客户说两个人 168 太贵了」，18 秒交回 3 个版本，价格只用了档案里的。',shot:'军师交回的结果',img:'assets/camp/b4-3.png'},
    {t:'用顺手的军师，明天上午学了「举一反三」以后，可以存成你自己的 skill，再装给手机上的 AI 员工。'}],
   pits:[
    ['话术太书面，不像我说话','给它一段你平时真实说过的话，说「照这个口气改」'],
    ['军师交回来的价格不对','它只能用档案里的价格；档案错了先改档案'],
    ['卡上【】里的没换就发出去了','它会先问你要，按它问的补上就行'],
    ['56 个太多，不知道用哪个','先用 3 个：首次回访、嫌贵应对、朋友圈文案']],
   done:['3 段自家话术，念着顺口','用过一个军师，交回来的结果能直接用'],
   junshi:true,
   notes:['时长 40 分钟：话术 15 分钟 → 介绍军师库 5 分钟 → 学员挑一个用 15 分钟 → 收尾 5 分钟','56 个军师分 10 类：销售 8、客服与售后 7、文案 7、短视频与新媒体 8、私域与社群 6、店长与门店 6、招聘与人事 5、报价采购与经营分析 5、招商 2、教务 2。每张卡都先读企业档案、缺信息先问（最多 3 个问题）、交付格式写死，字数都在 350 以内','来源：部分参考 agency-agents-zh 和它的上游 agency-agents（都是 MIT 许可），署名放在 skill 包的「军师库-NOTICE」里；原来的 56 条开场白作为场景来源','提醒：简历初筛军师会碰到候选人的姓名和电话，课上提醒先删身份证号和住址','对应结营 05：3 段话术 + 用过一个军师']}},
  {id:'b5',no:'05',step:'7',t:'完成第一个微信小程序',poster:'完成第一个微信小程序 —— 把产品接入微信生态，承接流量与用户',fix:'现场做的是测试号样品，只有自己能扫码打开；正式上架给客户用，课后约 2–4 周',do:'从 5 种小程序里挑一种最合你需求的（或说自己的需求，AI 先对照边界缩小）→ 生成 → 测试号 → 开发者工具预览 → 手机扫码打开',who:'柳',time:'16:30–17:30',body:{verify:'只有 ③（小工具搬进小程序）有现成骨架、测过代码；①②④⑤ 的骨架开课前要补齐并实测，手机扫码也要实测。',
   quick:['从下面 5 种小程序里挑一种，复制那段话发给 Codex','5 种都不合适，就说你自己的需求，AI 会先对照边界帮你缩小','打开微信开发者工具，用测试号','扫码，在自己手机的微信里打开'],
   why:'客户都在微信里，小程序就是你在微信里的一个小门面。做什么由你定，但今天有边界：只做一个小东西，不要登录、不要支付、不要后台。这样一小时内能做完，出了错也好改。今天做的是测试号样品，只有你自己能扫开；想给客户用，课后再走正式上架。',
   say:['我要做第 1 种：门店名片。','我要做第 3 种：把下午那个小工具搬进小程序。','我想做一个……（说你的需求），先帮我对照今天的边界，看能做成哪种。','电话按钮点了没反应，帮我查一下。','标题改成我们的店名，颜色用官网那个主色。'],
   exTitle:'5 种小程序，挑一种（复制那段话发给 Codex）',
   examples:[
    {h:'① 门店名片（内容最少，最容易做）',rows:[['做出来','店名、一句话介绍、3 张照片、营业时间；地址一点就导航，电话一点就拨打'],['照着说','帮我做一个门店名片小程序：店名、一句话介绍、3 张照片、营业时间，地址能一键导航，电话能一键拨打。内容只用企业档案里的。']]},
    {h:'② 价目单',rows:[['做出来','产品和价格列表，点开看详情，底部一键拨号'],['照着说','帮我做一个价目单小程序：列出档案里的产品和价格，点开能看包含什么，底部一个「电话咨询」按钮。档案里没有价格的写「请咨询」。']]},
    {h:'③ 小工具（下午那个搬进来）',rows:[['做出来','和网页版一样：问 3 个问题出结果，最后复制留资链接或一键拨号'],['照着说','把下午做的小工具做成小程序版：问题和结果跟网页版一致，最后一步改成「复制预约链接」和「一键拨号」。']]},
    {h:'④ 常见问答',rows:[['做出来','客户最常问的问题，点开看答案；答不了的一键拨号'],['照着说','帮我做一个常见问答小程序：用档案里的常见问题和答案，点开展开，最下面放「还有问题？打电话问」按钮。']]},
    {h:'⑤ 预约登记',rows:[['做出来','选服务、选日期时段、填称呼 → 生成一段预约信息，一键复制后发微信或拨电话'],['照着说','帮我做一个预约登记小程序：选服务、选日期和时段、填称呼，最后生成一段预约信息，能一键复制，旁边放一键拨号。不用真的提交到后台。'],['注意','测试号样品不接后台，信息不会自动进客户表，靠客户复制发给你']]}],
   steps:[
    {t:'看上面 5 种，挑一种最合你需求的，把「照着说」那段复制发给 Codex。拿不准就选 ①，内容最少。',shot:'选一种发给 Codex'},
    {t:'自己的需求不在 5 种里，就直接说。AI 会先对照边界：要登录、支付、会员、后台的，它会帮你缩成能做的那一种，原需求记进课后清单。',shot:'AI 帮你缩小需求'},
    {t:'等它生成。10-24 实测门店名片用了不到 2 分钟；档案里没有的营业时间，它写「待补」，没有拿示例资料凑。做好后它会停下来要「测试号 AppID」：这个要你本人用微信扫码申请（打开 developers.weixin.qq.com/sandbox），把 AppID 发给它。',shot:'小程序做好，等你给 AppID',img:'assets/camp/b5-1.png'},
    {t:'打开微信开发者工具，用测试号导入它生成的「小程序」文件夹，左边模拟器能直接看。',shot:'开发者工具里的模拟器'},
    {t:'点「预览」出二维码，用自己的微信扫，在手机上点一遍：电话能拨、地址能导航、文字没挤在一起。',shot:'手机上打开小程序'},{t:'下午收尾（17:30–18:00）：说「下一步」，AI 会先替你填好变现路径表初稿，晚上悦姐讲的时候直接在上面改。'}],
   pits:[
    ['想要在线支付、会员积分、商城','今天不做，测试号也做不了。缩成①或②，原需求记进课后清单'],
    ['扫码打不开','确认扫码的微信和登录开发者工具的是同一个；还不行先用模拟器看，手机扫码课后补'],
    ['想把网页直接塞进小程序','个人和测试号不能直接嵌网页，所以让 AI 照同样内容重做一份小程序版'],
    ['电话或导航按钮点了没反应','模拟器里有些按钮不响应，以手机上为准；手机上也不行就让 AI 查'],
    ['它做了 5 个页面，越做越大','说「只要一页，别的都删掉」']],
   done:['自己的手机微信里能打开你的小程序','里面的价格、电话、地址和档案一致','电话或导航至少有一个能用','你能说出它是哪一种、为什么选这种'],
   notes:['时长 60 分钟：讲 5 分钟（小程序是微信里的小门面；今天的边界）→ 选型 5 分钟 → 生成 20 分钟 → 开发者工具导入和手机扫码 20 分钟 → 收尾 10 分钟','边界（讲师开场就讲清）：只做一个小东西，最多 3 页；不登录、不支付、不做会员和后台；不收身份证等敏感信息；内容只从档案取；测试号样品只有自己能扫','skill 缺口：第 7 步现在只会做③（照说明书搬小工具），①②④⑤ 要补 4 套小程序骨架，开课前补好并实测','课前：每人微信开发者工具已扫码登录（课前准备 0.5）；助教备一份做好的①当兜底','对应结营 06：测试号手机扫码能打开']}}]},
 {id:'d1ev',icon:'1晚',name:'D1 晚上 · 把钩子产品变成钱',full:'DAY 1 晚上｜把你的钩子产品变成钱（19:30–21:30，顺序和时长悦姐定）',goal:'晚上结束：产品不是做出来就结束，而是要让它成为你的生意入口',items:[
  {id:'c1',no:'01',t:'拆解 AI 产品商业闭环',fix:'海报写「媛姐」，就是悦姐，海报定稿时改字',poster:'媛姐拆解 AI 产品商业闭环 —— 从「做出来」走到「有人用、有人买、能成交」',do:'悦姐讲，内容悦姐定',who:'悦姐',time:'悦姐定'},
  {id:'c2',no:'02',step:'9',t:'设计钩子产品的变现路径',poster:'设计钩子产品的变现路径 —— 明确免费入口、付费产品、成交路径与后续交付',do:'下午收尾（17:30–18:00）AI 已替每人填好变现路径表初稿 → 晚上边听边改 → 讲完交表',who:'悦姐',time:'悦姐定',body:{
   quick:['晚饭前说「下一步」，AI 替你填好变现路径表初稿','晚上边听悦姐讲，边在初稿上改','拿不准的格子留「待老板定」，讲完交表'],
   why:'前面做的官网、小工具都是「免费入口」。客户进来以后，你靠什么赚钱、在哪成交、怎么交付、怎么定价，这张表把它写在一页纸上。初稿由 AI 照你的档案、小工具和话术先填好，你听悦姐讲的时候直接在上面改，不用对着白纸发呆。',
   say:['下一步。','付费产品改成 XXX。','成交在微信里，我自己接。','定价那一栏先空着，我回去再想。','整理一下变现路径表，我要交了。'],
   steps:[
    {t:'下午收尾时说「下一步」。AI 照你的档案、小工具和话术，填好变现路径表初稿：免费用什么、付费买什么、在哪成交、怎么交付、怎么定价。',shot:'变现路径表初稿'},
    {t:'晚上听悦姐讲，想到哪改到哪：在 Codex 里直接说「付费产品改成……」。'},
    {t:'拿不准的格子留着「待老板定」，不硬填。'},
    {t:'讲完说「整理一下变现路径表」，交给助教。'}],
   pits:[['它填了一个我没有的产品','说「这个产品我们没有，删掉」；你想新加的产品和价格，直接告诉它'],['定价不知道写多少','先空着，标「待老板定」，回去想好再填']],
   done:['5 栏都有内容或「待老板定」','价格来自档案或你亲口定的，没有 AI 编的','交了表'],
   notes:['这一段的内容由悦姐定，这里只写学员手上要用的那张表','前置：D1 下午的小工具和话术已完成','对应结营 07']}},
  {id:'c3',no:'03',t:'拆解 AI 增值新商业体系',poster:'拆解 AI 增值新商业体系 —— C 端引流 + B 端成交 + AI 体系持续增值',do:'悦姐讲，内容悦姐定',who:'悦姐',time:'悦姐定'},
  {id:'c4',no:'04',t:'把 AI 能力包装成商业产品',poster:'把 AI 能力包装成商业产品 —— 让技术、内容、流量与成交真正连成一条线',do:'悦姐讲，内容悦姐定；柳讲 20 分钟案例',who:'悦姐 + 柳',time:'悦姐定'}]},
 {id:'d2am',icon:'2上',name:'D2 上午 · 让 AI 进入手机和办公',full:'DAY 2 上午｜让 AI 进入你的手机和日常办公',goal:'上午结束：一个手机随时可调用的 AI 员工，并完成核心项目上线',items:[
  {id:'e1',no:'01',step:'10',t:'手机控制 AI',poster:'用 DeepSeek 实现手机控制 AI —— 随时随地调用 AI、处理工作和项目任务',fix:'海报写 DeepSeek。实际用 Hermes（爱马仕），它的脑子用你的 ChatGPT 会员（和 Codex 同一个账号），不用 DeepSeek。电脑要开着，手机才指挥得动',do:'让 Codex 帮你装 Hermes → 用 ChatGPT 账号给它接上脑子 → 扫码接飞书或微信 → 设成只听你的、开机自动运行 → 手机发一句，电脑上的 AI 回你',who:'柳',time:'09:00–09:50',body:{verify:'Hermes 这一节还没在我们的电脑上从头走过：安装、接模型、扫码接飞书或微信、开机自启和手机回话，开课前讲师要实测并补截图。',
   quick:['对 Codex 说「帮我装 Hermes（爱马仕）」，它替你跑安装命令，约 5 分钟','打开终端输入 hermes model，选「ChatGPT or Codex Subscription」，用你的 ChatGPT 账号登录','输入 hermes gateway setup，选飞书或微信，用手机扫码','设成只听你一个人的，再让它开机自动运行','手机上给它发一句「你好」，电脑上的 AI 回你，就通了'],
   why:'Codex 很能干，但它在你的电脑上，你出门就用不了。Hermes（大家叫它爱马仕）是另一个装在你电脑上的 AI 程序，一直开着，替你守着飞书或微信：你在手机上发一句话，它在电脑上干活，再把结果发回手机。它的「脑子」用的还是你的 ChatGPT 会员（也就是 Codex 那个账号），不用另花钱、不用申请密钥。记住一条：电脑要开着、不能睡眠，手机才指挥得动。',
   say:['帮我装 Hermes（爱马仕），装完告诉我下一步。','装好了，帮我检查一下 hermes 命令能不能用。','我要接飞书，下一步在终端里输入什么？','我要接微信，下一步在终端里输入什么？','设成只有我能指挥它，别人发消息不理。','让它开机自动运行，电脑重启也能用。'],
   steps:[
    {t:'在 Codex 里说「帮我装 Hermes」。它会在电脑上运行官方安装命令：Windows 是 iex (irm https://hermes-agent.nousresearch.com/install.ps1)，Mac 是官网上 curl 开头的那一行。大约 5 分钟。Hermes 自带独立的 Python，不影响你电脑上已有的软件。',shot:'Codex 正在装 Hermes'},
    {t:'装好后打开一个新的终端窗口（不会开就问 Codex），输入 hermes model，在列表里选「ChatGPT or Codex Subscription」。屏幕上出现一个网址和一串验证码：用浏览器打开网址，输入验证码，登录你的 ChatGPT 账号。',shot:'选 ChatGPT or Codex Subscription'},
    {t:'输入 hermes，跟它打个招呼。它能回话，说明脑子接好了。',shot:'终端里第一次对话'},
    {t:'输入 hermes gateway setup，选平台。选飞书：用飞书手机 App 扫屏幕上的二维码，它会自动帮你建好机器人。选微信：用微信扫码，在手机上确认；之后你是给一个「机器人号」发消息，不是你自己的微信号。',shot:'扫码接飞书或微信'},
    {t:'设成只听你一个人的：让 Codex 帮你把自己加进允许名单（飞书是 FEISHU_ALLOWED_USERS，微信是 WEIXIN_ALLOWED_USERS）。不设的话，谁找到这个机器人都能指挥你的电脑。',shot:'允许名单设好'},
    {t:'输入 hermes gateway install，让它开机自动运行（Windows 会注册成计划任务），再输入 hermes gateway status，看到在运行就行。顺手把电脑设成插电时不睡眠：Windows 在 设置 → 系统 → 电源（笔记本叫「电源和电池」），把插电时的「睡眠」改成从不，屏幕照常关没关系；Mac 在 电池 → 选项 里打开「防止自动进入睡眠」。',shot:'gateway 运行中'},
    {t:'拿起手机，在飞书或微信里给机器人发「你好，你是谁」。电脑上的 AI 回你了，就通了。',shot:'手机上收到回复'}],
   pits:[
    ['安装卡住或报网络错误','换讲师热点再装一次；还不行举手，助教帮你装'],
    ['终端里找不到 hermes 命令','关掉终端重新开一个；还不行让 Codex 查一下装到哪了'],
    ['验证码过期了','重新输入 hermes model，用新的验证码'],
    ['飞书扫码后没反应','确认手机飞书登录的是你自己的账号；还不行，助教按官方文档手动建应用'],
    ['终端里的二维码显示成乱码','用二维码上方那个网址在浏览器里打开，再扫'],
    ['手机发消息没回复','先看电脑有没有睡眠；再输入 hermes gateway status，没在运行就输入 hermes gateway start'],
    ['微信机器人拉不进群','正常，微信这种机器人基本只能私聊；要在群里用就选飞书'],['用公司的飞书扫码，提示要管理员审批','公司飞书建机器人要管理员同意；课上先用自己注册的个人飞书'],['你电脑上本来就装过 Hermes、正在用，Codex 说要修复或重装','先停下叫助教，别让它修。那可能是你在用的另一套，修了会影响原来的设置（10-24 实测就碰到过）']],
   done:['手机上给它发一句，电脑上的 AI 回你了','只有你自己能指挥它，允许名单设好了','已设开机自动运行（Windows 要登录进系统后才会启动，设了开机密码的电脑开机后要先登录）'],
   notes:['时长 50 分钟：讲 5 分钟（Hermes 是什么、为什么电脑要开着）→ 安装 10 分钟 → 接模型 10 分钟 → 接飞书或微信 15 分钟 → 手机验证 10 分钟','依据 Hermes 官方文档（2026-10-24 查）：Windows 原生 PowerShell 可装，官网另有桌面版安装包；模型用 hermes model 选 ChatGPT or Codex Subscription，验证码登录；飞书推荐扫码自动建应用，手动建应用是兜底；微信走腾讯官方 iLink 机器人，基本只能私聊，默认谁都能发消息，必须设允许名单','⚠ 还没在我们的电脑上实测，截图也还没有。开课前在讲师电脑走一遍，截自己的图替换截图位。飞书官网、CSDN 上的教程只作参考，它们的截图不直接搬','建议默认接飞书：能扫码自动建机器人、能进群；微信只能私聊','现场装的风险：30 人同时下载会慢。装机会先确认能打开 Hermes 官网；现场备讲师热点','skill 缺口：第 10 步还写着旧命令 hermes auth add openai-codex，要改成 hermes model，并补「设允许名单」和「Codex 代装」','对应结营 08 的前半段']}},
  {id:'e2',no:'02',step:'10',t:'搭建一个协助办公的 AI 员工',poster:'搭建一个协助办公的 AI 员工 —— 让 AI 帮助整理信息、执行任务与推进工作',do:'接着上一节：Codex 把企业档案和话术整理成员工手册，装进 Hermes → 手机上问一句价格，答对就算上岗',who:'柳',time:'09:50–10:20',body:{verify:'员工手册装进 Hermes、手机上问价答对，这条链路还没实测。',
   quick:['接着上一节：手机已经能指挥电脑上的 Hermes','在 Codex 里说「下一步」，它把企业档案和话术整理成一本员工手册，做成 Hermes 能用的 skill','它把这个 skill 装进 Hermes，你重启一下 Hermes','手机上问它一句价格，答对就算上岗','再让它写一条朋友圈，看口气对不对'],
   why:'上一节接通的 Hermes 只是个「新来的」，不认识你的公司。这一节给它一本员工手册：公司是谁、价格多少、常见问题怎么答、跟客户怎么说话、什么不能乱说，都从企业档案和第一天写的话术里来。装上以后，你在手机上问它，它就按你家的口径回答；答不了的，按规矩它会说「我请老板回复您」；万一它编了，按下面「坑」里的办法处理。',
   say:['下一步。','把员工手册装到 Hermes 里。','（手机上）我们的招牌套餐多少钱？','（手机上）帮我写一条邀请老客户回店的朋友圈。','（手机上）按员工手册回答。','员工手册里的价格改成 XXX 元，再装一次。'],
   steps:[
    {t:'先确认上一节已经通了：手机发一句，电脑回你。没通先回上一节。'},
    {t:'在 Codex 里说「下一步」。它会读企业档案和第一天写的 3 段话术，写出一本「员工手册」：公司是谁、价格表、常见问题和答案、3 段话术、规矩（不编价格，答不了就说「我请老板回复您」）。',shot:'员工手册'},
    {t:'看一遍员工手册，价格和档案对得上就说「行」。',shot:'核对员工手册'},
    {t:'它把员工手册做成 Hermes 能用的 skill，复制到 Hermes 的 skill 文件夹，再让你重启 Hermes（终端里输入 hermes gateway stop，再输入 hermes gateway start，也可以让它替你执行）。',shot:'技能装进 Hermes'},
    {t:'手机上问一句价格，例如「招牌套餐多少钱」。答对了，说明它真的读了员工手册。',shot:'手机上答对价格'},
    {t:'再让它写一条朋友圈。口气不对，就在手机上直接说「语气再亲切一点」。',shot:'朋友圈文案'}],
   pits:[
    ['手机上问价格，它答错了或者说不知道','手机上说「按员工手册回答」；还错，就回 Codex 检查技能装进去没有、Hermes 重启没有'],
    ['它编了一个优惠','在 Codex 里说「员工手册加一条：档案里没有的优惠一律不说」，再装一次'],
    ['改了价格，它还按旧的说','改完档案后，让 Codex 重新生成员工手册、重新装进 Hermes，再重启'],
    ['客户也能找到这个机器人吗','现在只听你一个人的（上一节设了允许名单）。要不要让客户直接问它，课后再决定']],
   done:['手机上问价格，它答对了','让它写的朋友圈，口径和你家一致，没有编出来的优惠','你知道改了档案以后，怎么让它跟着更新'],
   notes:['时长 30 分钟：讲 3 分钟 → 生成员工手册 10 分钟 → 装进 Hermes 并重启 7 分钟 → 手机测试 10 分钟','前置：D2 上午 01 已接通；D1 下午 04 已写好话术','讲这几句：「它是新员工，得先给它员工手册。」「答不了就说请老板回复，比乱答强。」','对应 skill 第 10 步，模板是员工手册模板和 hermes 员工 skill 模板；Hermes 的 skill 文件夹是 ~/.hermes/skills/','⚠ 未实测：员工手册装进 Hermes、手机问价答对，这条链路还没走过','对应结营 08：手机上问价格答对']}},
  {id:'e3',no:'03',step:'11、12',t:'掌握举一反三的 AI 应用方法',poster:'掌握举一反三的 AI 应用方法 —— 不止会使用一个工具，而是学会自己解决问题',do:'教它干一件常干的小事，一句一句指导到对 → 固化成自己的 skill → 新开对话换一份资料再跑 → 装给 AI 员工，手机一句话触发。方法讲解链到「AI 入门」频道的第 2、4、5 关',who:'柳',time:'10:30–11:30',body:{verify:'手机上一句话触发 skill 这一步还没实测，要先走通 01、02。',
   quick:['接着上一节：AI 员工已经上岗，能答价格','挑一件你常干的小事（默认：整理今天的新客户），在 Codex 里一句一句教它，教到对','说「把刚才这件事固化成我的 skill」','新开一个对话，换一份资料再跑一遍，对了才算固化成功','把这个 skill 装给 AI 员工，手机上说一句，电脑自己干完'],
   why:'前面都是我们帮你搭好的，这一节学的是方法，以后你自己就会。方法就三步：先手把手教 AI 干一件事，教到对；再把你教的做法存下来，这就是 skill；最后换一份资料再试，还对，才算它真学会了。装给手机上的 AI 员工以后，你出门在外说一句，它就照着干。会了这一招，以后任何反复干的活，都能这样交出去。背后的道理，「AI 入门」频道的第 2、4、5 关（指挥它改、立规矩、验收）里讲了。',
   say:['下一步。','我常干的事是：整理今天的新客户，列出要回访的人和每人一句开场白。','不对，月饼礼盒 5 盒以上的算重要客户。','开场白要带客户的称呼，后半句按他的需求写。','把刚才这件事固化成我的 skill，名字叫「今日回访名单」。','（新对话里）今日回访名单，用这份新的客户表。','把这个 skill 装给 AI 员工。','（手机上）今日回访名单。'],
   exTitle:'5 件可以练的小事，挑一件',
   examples:[
    {h:'① 通用 · 整理今天的新客户（默认）',rows:[['给它什么','客户表导出的表格（没有就用示例表）'],['标准结果','今天要回访的名单：姓名、电话、需求、每人一句开场白']]},
    {h:'② 美业 / 门店 · 明天的到店提醒',rows:[['给它什么','预约记录（截图或表格）'],['标准结果','明天到店名单，每人一条提醒消息']]},
    {h:'③ 工厂 / 贸易 · 询价整理成报价单',rows:[['给它什么','一段询价聊天记录'],['标准结果','一份标准报价单：品名、规格、数量、单价、交期；单价只用价目表，交期没有就写待确认']]},
    {h:'④ 教培 · 课后反馈变家长周报',rows:[['给它什么','老师写的几句课堂记录'],['标准结果','一份给家长的周报：学了什么、表现、下周重点、家长怎么配合']]},
    {h:'⑤ 通用 · 语音变待办',rows:[['给它什么','老板的一段语音（转成文字）'],['标准结果','待办清单：谁、做什么、哪天之前；没说截止时间的标待定']]}],
   steps:[
    {t:'先确认上一节已经上岗：手机问价能答对。'},
    {t:'从上面 5 件小事里挑一件，默认「整理今天的新客户」，用课上发的示例客户表（你自己的客户表这时只有几条测试记录，练不出东西）。在 Codex 里说「下一步」，再说清你要它干什么。',shot:'说清要干的事'},
    {t:'它做出第一版。你看哪里不对，一次指一处，例如「月饼礼盒 5 盒以上算重要客户」。教到你满意为止，它会把你纠正的地方都记下来。',shot:'第一版和你的纠正'},
    {t:'说「把刚才这件事固化成我的 skill」，给它起个名字。它会写一份 skill，把你纠正过的规矩都写进去。',shot:'skill 文件'},
    {t:'新开一个对话，只说 skill 的名字，再给一份新的客户表。它照着规矩做对了，才算固化成功；不对就回去补规矩。',shot:'新对话里跑对'},
    {t:'说「把这个 skill 装给 AI 员工」，它复制到 Hermes 的 skill 文件夹，并提醒你重启 Hermes。',shot:'装给 AI 员工'},
    {t:'手机上发「今日回访名单」，电脑自己干完，把结果发回你手机。',shot:'手机收到名单'}],
   pits:[
    ['挑的事太大，比如「帮我做经营分析」','缩成一件十分钟能干完的小事，输入只有一份资料'],
    ['新对话里它不照你的规矩做','回到固化那一步，让它把你纠正过的点写进 skill 的规矩里，再试'],
    ['手机上说了没反应','先确认 skill 已经装进 Hermes 并重启了；再用 01 节的方法查 Hermes 在不在运行'],
    ['不想拿客户的真实信息练','先用示例客户表练，课后再换真的'],
    ['担心它把客户信息发出去','skill 里加一条规矩：只整理，不发送、不登录别的系统']],
   done:['有一份你认可的标准结果','新开对话、换一份资料，skill 也能跑对','手机上说一句，电脑把那件事干完，结果发回手机'],
   notes:['时长 60 分钟：讲 5 分钟（三步方法：先教、再存、换资料再试）→ 教它干活 20 分钟 → 固化 10 分钟 → 换资料复测 10 分钟 → 装给 AI 员工、手机触发 15 分钟','前置：D2 上午 02 已上岗；客户表能导出（D1 下午 02 建的）','10-05 命令行实测：默认例子从初稿、纠正到固化都走通了，换第二份客户表重跑正确；手机触发等 Hermes 实测后补','讲这几句：「先教，再存，换资料再试。」「教到你满意，它才学得会。」「会了这一招，什么活都能交出去。」','方法讲解链到「AI 入门」频道：第 2 关指挥它改、第 4 关立规矩、第 5 关验收（第 5 关的卡还在补）','对应结营 08 后半段（手机一句话干完）和「送：自己的 skill」']}},
  {id:'e4',no:'04',step:'6',t:'实战部署并上线自己的项目',poster:'实战部署并上线自己的项目 —— 完成核心项目部署上线，并掌握后续复制方法',do:'官网和小工具（网页版）上传到 GitHub → 手机关 Wi-Fi 用流量打开 → 当一回客户提交一次 → 客户表里看到这条 → 学会改了内容怎么重新上传。小程序不上线，测试号预览就够',who:'柳',time:'11:30–12:10',body:{
   quick:['说「下一步」，Codex 把官网和小工具上传到网上（它自己传，你不用动手）','等 1–3 分钟，它给你一个网址','手机关掉 Wi-Fi，用流量打开这个网址','在官网上点小工具，当一回客户，提交一次','打开飞书客户表，看到刚才那条，就通了'],
   why:'官网和小工具现在只在你自己电脑里，就像菜做好了还在自家厨房，客户吃不到。这一步把它们放到网上，拿到一个网址，发给谁都能打开。放在 GitHub 上，免费，不用买服务器。',
   reveal:[
    ['「上传到 GitHub」到底是什么？','Codex 把「发布」文件夹整个传上去，跟网盘同步一个意思，不是复制粘贴。以后改了内容再传一次，网址不变，内容变新。'],
    ['GitHub 是什么？','一个放网站文件的网站，每个账号送一块免费空间，传上去就能用网址打开。好比商场送你一个铺位，不收租。'],
    ['为什么要关 Wi-Fi 测？','你家网络能打开，不代表客户能打开。用流量打开一次，才算真的放到网上了。'],
    ['小程序为什么不上线？','正式上架要企业认证、审核、备案，至少一两周，课上做不完。今天只用测试号在自己手机上看。'],
    ['老板常问：要钱吗？','不要。'],
    ['老板常问：别人能改我的网站吗？','不能。只有登录了你 GitHub 账号的电脑能上传。'],
    ['老板常问：能换成我自己的域名吗？','能，课后再绑。国内要访问更稳，课后迁到国内服务器并备案。']],
   say:['下一步。','网址发我。','手机打不开，帮我看看。','招牌套餐改成 178 元，改到官网上，再上传一次。','我 GitHub 上原来有个网站，别动它。'],
   steps:[
    {n:'确认登录',t:'确认课前登录过 GitHub（课前准备 0.4）。没登录，叫助教。'},
    {n:'上传到网上',t:'说「下一步」。Codex 先看你 GitHub 上原来有没有网站：有就另开一个，不碰原来的。然后它把官网和小工具上传上去，只传网页，企业档案和客户表不会传。看到它要动原来的网站，马上点停止。',shot:'Codex 在上传'},
    {n:'拿到网址',t:'等 1–3 分钟，它发你一个网址，长这样：https://你的用户名.github.io/品牌名/',shot:'拿到网址'},
    {n:'手机打开',t:'拿手机，关掉 Wi-Fi，用流量打开这个网址。官网能看、按钮点得动，就对了。',shot:'手机打开官网'},
    {n:'当一回客户',t:'当一回客户：在官网上点「算算套餐预算」，就是你下午做的小工具。选人数，点「计算」，再点「打开客户表单」，名字填「测试」，留个电话，点提交。',shot:'在手机上提交一次'},
    {n:'看客户表',t:'打开飞书客户表，看到刚才那条「测试」，说明客户从看到官网到留下电话，这条路通了。',shot:'客户表里的测试记录'},
    {n:'以后改内容',t:'以后要改：先改档案，比如「招牌套餐改成 178 元」，再说「改到官网上，再上传一次」。一两分钟后刷新网址，就是新价格。网址不变。',shot:'改完再上传'}],
   pits:[
    ['它说 GitHub 没登录','叫助教，登录那一下你自己点'],
    ['等了 5 分钟还打不开','让它查一下；网址最后要带「/品牌名/」'],
    ['它要动你原来的网站','马上点停止，说「别动原来的，另开一个」'],
    ['手机用流量打不开','换个运营商的手机试；还不行，用主办方的备用网址'],
    ['客户表里没看到那条','看小工具最后那个表单，是不是你自己那份'],
    ['想用自己的域名','课后再弄']],
   done:['手机用流量能打开你的官网和小工具','提交的「测试」出现在你的飞书客户表里','改了一个价格，网上也跟着变了'],

/* ================= 检索（演示：中文双字 + 关键词，模拟向量检索） ================= */
const TH=0.3;
const STOP=new Set(['怎么','什么','一个','这个','那个','是不','不是','可以','我们','你们','就是','的话','能不','不能','有没','没有','一下','如何','我的','你的']);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9一-龥]/g,'');
function grams(s){
  const g=new Set(),low=s.toLowerCase();
  (low.match(/[a-z0-9]+/g)||[]).forEach(w=>{if(w!=='ai'&&w.length>1)g.add(w)});
  (low.match(/[一-龥]+/g)||[]).forEach(run=>{
    if(run.length===1){if(!STOP.has(run))g.add(run);return}
    for(let i=0;i<run.length-1;i++){const b=run.slice(i,i+2);if(!STOP.has(b))g.add(b)}
  });
  return g;
}
CARDS.forEach(c=>{c._g=grams([c.q,...c.ask,...c.kw].join('，'))});
GAPS.forEach(g=>{g._g=grams(g.q)});
function score(q,c){
  const qg=grams(q);if(!qg.size)return 0;
  let hit=0;qg.forEach(x=>{if(c._g.has(x))hit++});
  const nq=norm(q);let bonus=0;
  c.kw.forEach(k=>{if(nq.includes(norm(k)))bonus+=0.22});
  return hit/qg.size*0.85+Math.min(bonus,0.45);
}

    const it=document.querySelector(`.it[data-card="${v.id}"]`);
    if(it){it.scrollIntoView({block:'nearest'});if(fromBot)it.classList.add('flash')}
    if(fromBot){const s=document.querySelector('.sec.say');s&&s.classList.add('flash')}
  }
}

/* ================= 聊天 ================= */
const msgs=$('#msgs');
const scrollDown=()=>{msgs.scrollTop=msgs.scrollHeight};
function addMsg(who,html){const d=document.createElement('div');d.className='msg '+who;d.innerHTML=html;msgs.appendChild(d);scrollDown();return d}
function userSay(t){addMsg('me',`<div class="bubble">${esc(t)}</div>`)}
async function typeInto(el,text){
  for(let i=0;i<text.length;i++){el.textContent+=text[i];if(i%2===0){scrollDown();await sleep(14)}}
}
// lines: 字符串，或 [加粗标签, 正文]
async function botSay(lines,acts,pre=''){
  S.busy=true;
  const t=addMsg('bot','<div class="bubble typing"><i></i><i></i><i></i></div>');
  await sleep(550);t.remove();
  const r=addMsg('bot',`${pre}<div class="bubble">${lines.map(()=>'<p></p>').join('')}</div>`);
  const ps=r.querySelectorAll('.bubble p');
  for(let i=0;i<lines.length;i++){
    const L=lines[i];
    if(Array.isArray(L)){ps[i].innerHTML=`<b>${L[0]}</b><span></span>`;await typeInto(ps[i].lastChild,L[1])}
    else await typeInto(ps[i],L);
    await sleep(120);
  }
  if(acts&&acts.length){
    const d=document.createElement('div');d.className='acts';
    d.innerHTML=acts.map(([k,txt,cls])=>`<button class="act-btn ${cls||''}" data-do="${k}">${txt}</button>`).join('');
    r.appendChild(d);
  }
  scrollDown();S.busy=false;return r;
}
const guideActs=()=>[['next','看完了，下一步','primary'],['skip','这节我会了，跳过'],['askq','我有个问题']];

function setMode(m){S.mode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m))}

function logGap(q){
  const nq=norm(q),qg=grams(q);
  GAPS.forEach(g=>g.fresh=false);
  const m=GAPS.find(g=>{
    if(g.kw&&g.kw.filter(k=>nq.includes(norm(k))).length>=2)return true;
    let hit=0;qg.forEach(x=>{if(g._g.has(x))hit++});
    return qg.size&&hit/qg.size>=0.5;
  });
  let n=1;
  if(m){m.n++;m.fresh=true;n=m.n}else GAPS.push({q,n:1,src:'学员提问 · 知识库没找到',_g:qg,fresh:true});
  renderTree();if(S.view.type==='gap')renderReader();
  const b=$('#gapbadge');b&&b.classList.add('pulse');
  return n;
}

async function explain(c){
  openView({type:'card',id:c.id});
  await botSay(['换个说法讲。',['打个比方：',c.ana],['说白了就一句：',c.say.split('。')[0]+'。'],['你先做这一步：',c.act],'做完回来跟我说，咱们看看效果。']);
}

async function ask(q){
  q=String(q).trim();if(!q||S.busy)return;
  userSay(q);$('#inp').value='';$('#topq').value='';
  const m=q.match(/^这一节我没太懂：(.+)$/);
  if(m){const c=CARDS.find(x=>x.q===m[1]);if(c)return explain(c)}

  const ctxId=S.view.type==='card'?S.view.id:null;
  const ranked=CARDS.map(c=>({c,s:score(q,c)+(c.id===ctxId?0.08:0)})).sort((a,b)=>b.s-a.s);
  const top=ranked.filter(r=>r.s>=TH).slice(0,2);

  if(!top.length){
    const n=logGap(q);
    await botSay(['这个问题我的知识库里还没有，我不瞎编。',
      '已经记进待补清单了，杰哥下场直播亲自答，答完整理成卡，下回你再问我就会了。'+(n>1?'这个问题已经有 '+n+' 个人问过了，会优先补。':'')],
      [['gap','看看待补清单']],
      `<div class="retr miss">🔍 翻遍了知识库，没找到能回答这个问题的卡</div>`);
    return;
  }
  const c=top[0].c;
  openView({type:'card',id:c.id},{fromBot:true});
  const pre=`<div class="retr">🔍 翻了知识库，找到 ${top.length} 张相关的卡${top.map(x=>`<button class="hit" data-card="${x.c.id}"><span>📇 ${x.c.q}</span><em>匹配 ${Math.round(Math.min(x.s,0.97)*100)}%</em></button>`).join('')}</div>`;
  const where=c.lv===2?'这正好是你现在这一关要练的，':'这一节在'+lvName(c.lv)+'，';
  await botSay([c.say,['打个比方：',c.ana],['你现在就做一件事：',c.act],where+'已经在中间给你打开了，完整的看那儿。'],
    top[1]?[['open:'+top[1].c.id,'也看看：'+top[1].c.q]]:null,pre);
}

async function doAction(a,btn){
  if(a==='home')return openView({type:'home'});
  if(a==='gap')return openView({type:'gap'});
  if(a.startsWith('open:'))return openView({type:'card',id:a.slice(5)},{fromBot:true});
  if(S.busy)return;
  if(btn&&btn.closest('.acts'))btn.closest('.acts').querySelectorAll('button').forEach(b=>b.disabled=true);

  if(a==='start-guide'){
    setMode('guide');userSay('跟着你一步步走');
    const id=PATH[S.pi];openView({type:'card',id},{fromBot:true});
    return botSay(['好，按你的水平，从第 2 关「指挥它改」开始。中间已经打开了第一节：《'+card(id).q+'》。','看完点下面的按钮。会的直接跳过，不用每节都看。'],guideActs());
  }
  if(a==='free'){
    setMode('free');userSay('我自己翻');
    return botSay(['行，左边目录随便点，不锁关。','你打开哪一节我都知道，卡住了直接问，我把你带到对应的地方。']);
  }
  if(a==='askq'){$('#inp').focus();return botSay(['说吧，用你自己的话问。'])}
  if(a==='next'||a==='skip'){
    userSay(a==='next'?'看完了，下一步':'这节我会了，跳过');
    const cur=PATH[S.pi],nid=PATH[S.pi+1];
    if(!nid)return botSay(['知识库里的卡都过了一遍。接下来去第 6 关：自己挑一件新活，做完拿给我看。']);
    const crossed=card(nid).lv!==card(cur).lv;
    openView({type:'card',id:nid},{fromBot:true});
    const lines=[];
    if(crossed)lines.push(lvName(card(cur).lv)+'的内容过完了，接下来是'+lvName(card(nid).lv)+'。');
    lines.push((a==='skip'?'行，跳过。':'好。')+'下一节：《'+card(nid).q+'》，已经在中间打开了。');
    return botSay(lines,guideActs());
  }
  if(a==='done-step'){
    if(S.view.type!=='card')return;
    const c=card(S.view.id);
    userSay('「马上动手」那一步我做完了');
    const first=[2,3,4].includes(c.lv)&&!S.did.has(c.lv);
    S.did.add(c.lv);renderProg();
    const lines=['好样的，做了才算数。改了几轮？最后满不满意？把结果截个图发我看看。（演示版还没接图片）'];
    if(first)lines.push(lvName(c.lv)+'，点亮「'+lvl(c.lv).badge+'」。');
    return botSay(lines,S.mode==='guide'?[['next','下一步','primary']]:null);
  }
}

/* ================= 事件 ================= */
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('tocopen')});
document.addEventListener('click',e=>{
  if(document.body.classList.contains('tocopen')&&!e.target.closest('#tree,#tocbtn,#tocbar'))document.body.classList.remove('tocopen');
  const t=e.target.closest('#tocbar,#tocbtn,[data-ctog],[data-goto],[data-ver],[data-chan],[data-copy],[data-cdo],[data-cblock],[data-citem],[data-mode],[data-do],[data-ask],[data-card],[data-ch]');if(!t)return;
  if(t.disabled)return;
  if(t.dataset.chan){if(S.chan!==t.dataset.chan)setChan(t.dataset.chan);return}
  if(t.dataset.ver){S.ver=t.dataset.ver;history.replaceState(null,'',campHash());renderTree();renderReader();fillJunshi();spy();return}
  if(t.dataset.goto){goSec(t.dataset.goto);return}
  if(t.dataset.ctog){e.stopPropagation();const id=t.dataset.ctog;S.closed.has(id)?S.closed.delete(id):S.closed.add(id);renderTree();spy();return}
  if(t.id==='tocbar'||t.id==='tocbtn'){document.body.classList.toggle('tocopen');return}
  if(t.dataset.copy!==undefined){const o=t.textContent;(navigator.clipboard?navigator.clipboard.writeText(t.dataset.copy):Promise.reject()).then(()=>{t.textContent='已复制 ✓';setTimeout(()=>t.textContent=o,1200)}).catch(()=>{});return}
  if(t.dataset.cdo)return openC({type:t.dataset.cdo});
  if(t.dataset.cblock){S.closed.delete(t.dataset.cblock);return openC({type:'cblock',id:t.dataset.cblock})}
  if(t.dataset.citem)return openC({type:'citem',id:t.dataset.citem});
  if(t.dataset.mode){if(S.mode!==t.dataset.mode)doAction(t.dataset.mode==='guide'?'start-guide':'free');return}
  if(t.dataset.do)return doAction(t.dataset.do,t);
  if(t.dataset.ask)return ask(t.dataset.ask);
  if(t.dataset.card)return openView({type:'card',id:t.dataset.card},{fromBot:!!t.closest('#msgs')});
  if(t.dataset.ch!==undefined)return openView({type:'ch',id:+t.dataset.ch});
});
$('#sugs').innerHTML=SUGS.map(s=>`<button class="sug" data-ask="${s}">${s}</button>`).join('');
$('#send').onclick=()=>ask($('#inp').value);
$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)ask($('#inp').value)};
$('#topq').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)ask($('#topq').value)};

/* ================= 启动 ================= */
$('#reader').addEventListener('scroll',spy,{passive:true});window.addEventListener('scroll',spy,{passive:true});
renderTree();renderReader();renderProg();updateCtx();
(()=>{const m=location.hash.match(/^#camp(-t)?(?:\/(\w+))?$/);if(!m)return;if(m[1])S.ver='tea';setChan('b');if(m[2]&&citem(m[2]))openC({type:'citem',id:m[2]});else $('#tocbar b').textContent=tocLabel()})();
(async()=>{
  await botSay(['我是杰哥的 AI 分身。口气是杰哥的，人不是。']);
  await botSay(['摸底下来，你用过 AI，建议从第 2 关「指挥它改」开始。','你想怎么学？跟着我一步步走，还是自己翻、卡住了再叫我？'],
    [['start-guide','跟着你一步步走','primary'],['free','我自己翻']]);
})();

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>杰哥的 AI 私教 · Demo v2</title>
<style>
:root{
  --bg:#f7f5f0;--paper:#fffdf9;--ink:#1d2129;--sub:#6b7280;--line:#ebe6dc;
  --accent:#e8590c;--accent-soft:#fff1e8;--ok:#2f9e44;--ok-soft:#ebfbee;
  --blue:#1c7ed6;--blue-soft:#e7f5ff;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button{font:inherit;color:inherit}

/* 顶栏 */
.top{height:60px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;flex:none}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.tag{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;width:min(380px,40vw)}
.search input{flex:1;border:none;outline:none;font:inherit;padding:8px 0;background:none}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}
.me{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;background:#fff;flex:none}

.main{display:grid;grid-template-columns:270px minmax(0,1fr) 400px;height:calc(100vh - 60px)}

/* 左：目录 */
.toc{border-right:1px solid var(--line);overflow:auto;overflow-anchor:none;padding:20px 12px 30px;background:#faf8f3}
.toc-title{font-size:12px;color:var(--sub);font-family:var(--mono);margin:0 8px 14px;display:flex;align-items:center;gap:6px}
.toc-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ch{margin-bottom:4px}
.ch-head{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;font-weight:600}
.ch-head:hover{background:#f1ede4}
.ch-head.on{background:var(--accent-soft)}
.ch-icon{width:24px;height:24px;border-radius:7px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--accent);flex:none;font-weight:600}
.ch-n{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400;font-family:var(--mono)}
.it{padding:6px 8px 6px 42px;border-radius:9px;cursor:pointer;font-size:13px;color:#495057;position:relative}
.it:hover{background:#f1ede4}
.it.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.it .st{position:absolute;left:26px;top:13px;width:7px;height:7px;border-radius:50%;background:#dee2e6}
.it.seen .st{background:var(--ok)}
.it.on .st{background:var(--accent)}
.it.flash{animation:flash 1.4s}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--accent) inset;background:#ffe8cc}}
.toc-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:auto;font-weight:600}
.badge.pulse{animation:pulse .5s 3}
@keyframes pulse{50%{transform:scale(1.35)}}

/* 中：阅读区 */
.reader{overflow:auto;padding:40px 48px 70px;background:var(--paper)}
.inner{max-width:740px;margin:0 auto}
.crumb{font-size:12px;color:var(--sub);font-family:var(--mono);margin-bottom:16px}
.crumb a{color:var(--accent);cursor:pointer}
.rtitle{font-family:var(--serif);font-size:32px;line-height:1.35;font-weight:800;margin-bottom:14px}
.lead{font-size:16px;color:#495057;line-height:1.9;margin-bottom:20px}
.meta{font-family:var(--mono);font-size:12px;color:var(--sub);padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px;display:flex;gap:12px;flex-wrap:wrap}
.sec{border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:18px;background:#fff}
.sec h2{font-family:var(--serif);font-size:20px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 i{color:var(--accent);font-size:14px}
.sec .body{font-size:15px;line-height:1.9}
.quote{font-size:18px;line-height:1.85;border-left:4px solid var(--accent);padding:2px 0 2px 16px}
.draft{font-family:system-ui,sans-serif;font-style:normal;font-weight:500;font-size:12px;color:#e67700;background:#fff9db;padding:1px 7px;border-radius:5px}
.actbox{background:var(--accent-soft);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.8;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{color:#fff;opacity:.9}
.qchip{border:1px solid var(--line);background:#f8f9fa;border-radius:999px;padding:4px 12px;margin:0 6px 8px 0;cursor:pointer;font-size:13px}
.qchip:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.navbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;font-weight:500}
.navbtn:hover{border-color:var(--accent)}
.navbtn small{display:block;color:var(--sub);font-size:12px;font-weight:400;font-family:var(--mono)}
.navbtn.r{text-align:right;grid-column:2}
.sec.flash{animation:secflash 1.8s}
@keyframes secflash{0%,100%{box-shadow:0 0 0 0 rgba(232,89,12,0)}25%{box-shadow:0 0 0 5px rgba(232,89,12,.3)}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.tile{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.05)}
.tile b{display:block;font-size:15px;margin-bottom:4px}
.tile p{font-size:13px;color:var(--sub)}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvc{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;cursor:pointer}
.lvc:hover{background:#f8f6f1}
.lvc b{display:block;font-size:14px}
.lvc small{color:var(--sub);font-size:12px}
.goalbox{border:1px dashed var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:20px;background:#fffaf5;font-size:15px}
.goalbox span{display:block;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px;background:#fff}
.lrow{display:flex;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:#faf8f3}
.ln{font-family:var(--mono);color:var(--sub);font-size:12px}
.lt{flex:1;font-weight:500}
.ls{font-size:12px;color:#adb5bd}
.lrow.seen .ls{color:var(--ok)}
.emptybox{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--sub);background:#fff}
.gapitem{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff}
.gapitem.fresh{border-color:#ffc9c9;background:#fff5f5}
.gapitem b{display:block}
.gapitem small{color:var(--sub)}
.gapitem .cnt{color:#c92a2a;font-weight:600;margin-right:10px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:20px}
.flow span{background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 10px}

/* 右：陪练聊天 */
.chat{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.chead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff922b,#e8590c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;position:relative;flex:none}
.cav::after{content:'';position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#40c057;border:2px solid #fff}
.cname{font-weight:600}
.csub{font-size:12px;color:var(--sub)}
.modes{margin-left:auto;display:flex;background:#f1ede4;border-radius:9px;padding:3px;flex:none}
.modes button{border:none;background:none;font-size:12px;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--sub)}
.modes button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prog{padding:12px 16px;border-bottom:1px solid var(--line);background:#fffdf9}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.prog-row b{color:var(--ink);font-family:var(--mono)}
.pbar{height:5px;background:#eee;border-radius:99px;margin:6px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.mils{display:flex;gap:6px}
.mil{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 8px;border-radius:9px;background:#f8f9fa;color:#adb5bd}
.mil .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e9ecef;font-size:11px;flex:none}
.mil.got{background:var(--ok-soft);color:var(--ok);font-weight:600}
.mil.got .ic{background:var(--ok);color:#fff}
#msgs{flex:1;overflow:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;background:#fbfaf7}
.msg{display:flex;flex-direction:column;max-width:92%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.bot{align-self:flex-start}
.bubble{padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.msg.me .bubble{background:var(--ink);color:#fff;border-color:var(--ink);border-bottom-right-radius:4px}
.msg.bot .bubble{border-bottom-left-radius:4px}
.bubble p+p{margin-top:7px}
.bubble p:empty{display:none}
.bubble p b{color:var(--accent);font-weight:600}
.retr{font-size:12px;color:var(--sub);margin-bottom:6px;display:flex;flex-direction:column;gap:4px}
.retr.miss{color:#c92a2a}
.hit{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;font-size:12px;background:var(--blue-soft);color:#1864ab;border:1px solid #d0ebff;border-radius:8px;padding:5px 10px;cursor:pointer}
.hit:hover{border-color:var(--blue)}
.hit em{font-style:normal;font-weight:600;flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.act-btn{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.act-btn.primary{background:var(--accent);color:#fff}
.act-btn:disabled{opacity:.35;cursor:default}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#adb5bd;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.ctx{display:none;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding:8px 14px 0;border-top:1px solid var(--line)}
.ctx.on{display:flex}
.ctx b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ctx button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px;flex:none}
.ctx button:hover{border-color:var(--accent);color:var(--accent)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.sug{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.sug:hover{border-color:var(--accent);color:var(--accent)}
.inbar{display:flex;gap:8px;padding:10px 14px 6px}
#inp{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
#inp:focus{border-color:var(--accent)}
#send{padding:0 18px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.fine{font-size:11px;color:#9aa0a6;padding:0 14px 10px}

/* 频道切换 */
.chans{display:flex;gap:2px;background:#f1ede4;border-radius:10px;padding:3px;flex:none}
.chans button{border:none;background:none;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--sub)}
.chans button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
body.camp .chat,body.camp .search{display:none}
body.camp .main{grid-template-columns:320px minmax(0,1fr)}
.ch-icon.w{width:auto;min-width:24px;padding:0 5px;font-size:11px}
.it .tm{display:block;font-family:var(--mono);font-size:11px;color:#adb5bd;font-weight:400}
.who{font-size:11px;border-radius:5px;padding:1px 7px;background:#f1ede4;color:#495057;margin-left:6px;font-weight:500;white-space:nowrap}
.who.y{background:#fff0f6;color:#c2255c}
.sec.todo{opacity:.6;border-style:dashed}
.fixbox{background:#fff9db;border:1px solid #ffe066;border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.8;color:#5c3c00;margin-bottom:18px}
.fixbox b{color:#e67700}
.it .fx{color:#e67700;font-size:11px;margin-left:4px}
.jscat{font-weight:700;margin:16px 0 8px;color:var(--accent)}
.jsc{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:#fff}
.jsc summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.jsc summary span{color:var(--sub);font-size:13px}
.jsm{font-size:13px;color:var(--sub);margin:8px 0}
.jsp{white-space:pre-wrap;font-family:inherit;font-size:13px;background:#faf8f3;border-radius:8px;padding:10px 12px;margin:0 0 8px;line-height:1.8}
.lead1{font-size:15px;color:#495057;line-height:1.8;margin:-4px 0 16px}
.posterbox{padding:12px 18px}.posterbox summary{cursor:pointer;font-weight:600;color:var(--sub);font-size:14px}.posterbox summary em{font-style:normal;color:#e67700}
.posterbox .quote{margin-top:12px;font-size:15px}
.ch.closed .it,.ch.closed .sub{display:none}
.caret{margin-left:6px;border:none;background:none;cursor:pointer;color:var(--sub);font-size:12px;padding:0 4px}
.sub{margin:2px 0 6px 40px;border-left:2px solid var(--line);padding-left:6px}
.subi{font-size:12.5px;color:#868e96;padding:4px 8px;border-radius:6px;cursor:pointer;line-height:1.5}
.subi.l2{padding-left:20px;font-size:12px}
.subi:hover{color:var(--ink);background:#f1ede4}
.subi.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.secnav{display:none}
#tocbar{display:none}
[id^="sx-"]{scroll-margin-top:16px}
a.gl{color:inherit;text-decoration:none;border-bottom:1px dashed var(--accent);cursor:pointer}
a.gl:hover{color:var(--accent)}
.glitem h2{font-size:18px;align-items:baseline}.glitem h2 small{font-size:12px;color:var(--sub);font-weight:400;font-family:inherit}
.glitem .body{margin-top:-4px}.glu{font-size:13px;color:var(--sub);margin-top:6px}.glu a{color:var(--accent);cursor:pointer}
.glitem.flash{animation:secflash 1.8s}
[id^="gl-"]{scroll-margin-top:16px}
.rwrap .inner{max-width:640px}
.sh{font-weight:600;font-size:16px;line-height:1.7;color:var(--ink)}
.sd{font-size:15px;line-height:1.85;color:#495057;margin-top:2px}
.body.why{font-size:16px;line-height:1.9}.body.why+.body.why{margin-top:6px}
.ql li{font-size:16px;line-height:2}
.stp{margin-bottom:10px}
.tag{display:inline-block;background:#f1ede4;border-radius:6px;padding:0 8px;margin:0 2px;font-size:.93em;line-height:1.75;color:var(--ink)}
.formula{font-size:17px;font-weight:600;color:var(--ink);background:#f6f2ea;border-radius:10px;padding:12px 16px;margin:6px 0 12px;line-height:1.8}
.sec.lesson{border:1.5px solid #e9dcc3}
.dlbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px}.dlbox span{font-size:13px;color:var(--sub);line-height:1.7;flex:1;min-width:220px}a.btn{text-decoration:none;display:inline-block}
.skstep code{font-family:inherit;background:#f1ede4;border-radius:4px;padding:0 4px;font-size:.92em}.skstep{padding:10px 0;border-top:1px dashed #eadfcb}.skstep:first-of-type{border-top:0}.skstep .sh small{font-weight:400;color:var(--sub);font-size:12.5px;margin-left:6px}.skstep .sd b{display:inline-block;min-width:5.5em;color:var(--sub);font-weight:500}
.verbar{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.verbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12px;color:var(--sub)}
.verbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.verbar span{font-size:12px;color:var(--sub)}
.sec.reveal{border-color:#d0ebff;background:#f5fbff}
.sec.reveal h2 i{color:var(--blue)}
.rv{padding:8px 0;border-bottom:1px solid #e3f1fc}.rv:last-child{border-bottom:none}
.rv b{display:block;font-size:15px}.rv p{font-size:15px;line-height:1.8;color:#343a40}
.shotimg{margin:10px 0 16px}
.shotimg img{display:block;max-width:100%;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.shotimg figcaption{font-size:12px;color:var(--sub);margin-top:6px;text-align:center}
.ql{padding-left:22px;font-size:15px;line-height:2}
.stp{display:flex;gap:12px;margin-bottom:4px}
.stp>b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;margin-top:4px}
.stp>div{flex:1;font-size:15px;line-height:1.85}
.shot{border:1px dashed #ced4da;border-radius:10px;padding:14px;text-align:center;color:#adb5bd;font-size:12px;margin:8px 0 14px;background:#fafafa}
.pit{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.75}
.pit:last-child{border-bottom:none}
.pit>div:first-child{font-weight:600}
.dl{list-style:none;font-size:15px;line-height:2}
.dl li::before{content:'☐ ';color:var(--ok)}
.ex{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px;background:#fcfbf8}
.ex h3{font-size:15px;margin-bottom:8px}
.ex table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.7}
.ex td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
.ex td:first-child{width:96px;color:var(--sub);white-space:nowrap}
details.notes summary{cursor:pointer;font-weight:600;color:var(--sub)}
details.notes ul{margin-top:10px;padding-left:20px;font-size:14px;line-height:1.9;color:#495057}
details.notes .ng{margin-top:16px}details.notes .ng .sh{font-size:15px}details.notes .ng ul{margin-top:4px;font-size:15px}
@media(max-width:900px){.pit{grid-template-columns:1fr;gap:2px}}
.phr{display:inline-block;border:1px solid var(--line);background:#f8f9fa;border-radius:999px;padding:4px 12px;margin:0 6px 8px 0;font-size:13px;font-family:var(--mono)}

@media(max-width:1180px){.main{grid-template-columns:220px minmax(0,1fr) 340px}body.camp .main{grid-template-columns:260px minmax(0,1fr)}.reader{padding:28px 26px 60px}.tiles{grid-template-columns:1fr}.lvgrid{grid-template-columns:1fr}}

 {id:'d1am',icon:'1上',name:'D1 上午 · 搭好 AI 开发环境',full:'DAY 1 上午｜搭好你的 AI 开发环境',goal:'上午结束：AI 开发环境 + 企业知识库 + 第一版官网',items:[
  {id:'a1',no:'01',t:'安装官方版 Codex',poster:'安装官方版 Codex —— 掌握后续更新、升级与持续使用路径',do:'装好 ChatGPT 桌面版，打开 Codex，让实训营助手带你开始。',who:'柳',time:'09:00–09:30',body:{
   quick:['在微软商店装 ChatGPT 桌面版','用课前注册的邮箱登录','左上角切到 Codex','新建项目，选你的公司文件夹','说[[用实训营助手（ai-camp）开始]]'],
   why:['这两天写网页、做工具、写文案，都是 Codex 在干活。','它就在 ChatGPT 桌面版里，账号是你课前注册的那个。'],
   reveal:[['为什么要装桌面版，网页版不行？','网页版碰不到电脑里的文件。桌面版里的 Codex 能在公司文件夹里建文件、改文件。'],['实训营助手怎么起作用？','它是放在公司文件夹里的一套课程说明书。学员说一件真实的活，比如「帮我做官网」，Codex 先翻到说明书里对应那一页，再照着做。'],['为什么一定要点名「实训营助手」？','只说「开始」，Codex 不知道要上这门课，会当成普通聊天。点了名，它才去读说明书。'],['它会乱动电脑里别的东西吗？','不会。它只在学员选的那个公司文件夹里干活。「信任文件夹」就是允许它在这个文件夹里改东西。'],['以后怎么升级？','Windows 版跟着微软商店自动更新。Mac 版在菜单里检查更新。']],
   say:['用实训营助手（ai-camp）开始。','现在到哪了？','Codex 怎么更新到最新版？'],
   steps:[{n:'装桌面版',h:'在微软商店装 ChatGPT',t:'搜 ChatGPT，装发行方是 OpenAI、名字里没有 Classic 的那个。Mac 去 ChatGPT 官网下载。',shot:'认准名字里没有 Classic 的那个',img:'assets/camp/a1-1.png'},{n:'登录',h:'用课前注册的邮箱登录',t:'点「继续登录」，填邮箱，去邮箱拿验证码填回来。工作空间选「个人账户」。',shot:'继续登录、填邮箱、选个人账户',img:['assets/camp/a1-2a.png','assets/camp/a1-2b.png','assets/camp/a1-2c.png']},{n:'切到 Codex',h:'左上角切到 Codex',t:'看到「与 Codex 协作」的输入框，就装好了。',shot:'左上角切到 Codex',img:'assets/camp/a1-3.png'},{n:'学会更新',h:'记住以后怎么更新',t:'Windows 版跟着微软商店自动更新。Mac 版在菜单里检查更新。'},{n:'放好文件夹',h:'把讲师发的「工作区模板」复制到电脑上',t:'改成你的公司名，比如「陶陶居AI工作区」。实训营助手和「资料」文件夹都在里面了。'},{n:'新建项目',h:'在 Codex 里新建项目，选这个文件夹',t:'弹出「信任此文件夹吗？」，点[[信任文件夹]]。',shot:'新建项目、选文件夹、信任',img:['assets/camp/a1-6a.png','assets/camp/a1-6b.png','assets/camp/a1-6c.png']},{n:'开始',h:'说[[用实训营助手（ai-camp）开始]]',t:'它建好进度表，接着问你公司全称和城市。',shot:'它问公司名和城市',img:'assets/camp/a1-7b.png'}],
   pits:[['商店里搜到两个 ChatGPT','装名字里没有 Classic 的那个'],['登录时要填手机号','网络稳定一般不会弹。弹了就用短信验证，不行先用主办方的备用账号'],['它回「你想先做什么？」','你可能只说了「开始」。再说一遍[[用实训营助手（ai-camp）开始]]'],['还是没按实训营走','叫助教，看看实训营助手放对位置没有'],['它说没有权限改文件','刚才没点「信任文件夹」，叫助教帮你改'],['提示额度不够','会员可能没到账，找助教']],
   done:['ChatGPT 里能切到 Codex','说完开始那句话，它问你公司全称和城市','你知道以后怎么更新'],
   notes:[{h:'时间怎么分（共 30 分钟）',t:['开场，5 分钟。讲两天能带走哪 9 样东西。','装桌面版并登录，10 分钟。','讲以后怎么更新，3 分钟。','放工作区模板、建项目、点信任，10 分钟。','说开始那句话，2 分钟。']},{h:'课前准备',t:['学员课前只注册账号、充好会员。软件现场装。','30 人同时下载会很慢，讲师备好热点。','讲师准备好「工作区模板」，现场用 U 盘或群文件发。']},{h:'为什么模板要讲师提前建',t:['模板里已经放好实训营助手和空的「资料」文件夹。','实训营助手放在 .agents\\skills\\ai-camp 里。Mac 默认看不到「.」开头的文件夹，学员自己建容易出错。']},{h:'对应结营',t:['第 1 项：知道以后怎么升级 Codex。']}]}},
  {id:'a2',no:'02',step:'1',t:'让 AI 读懂你的公司，建企业知识库',poster:'让 AI 读懂你的电脑 —— 分析电脑、文件与工作环境，建立专属 AI 企业知识库',fix:'海报写「读懂你的电脑」。实际只读你交的资料和网上的公开信息，不扫整台电脑',do:'AI 上网查你的公司，加上你交的资料，整理成一份企业档案，你来核对。',who:'柳',time:'09:30–10:20',body:{
   lesson:{h:'怎么让 AI 干活',f:'基于【什么资料】，帮我做【什么】，给【谁】用，做完【我怎么检查】',t:['从这一节起，每次让 AI 干活，都照这句话说。','四块不用每次说全。资料和要做什么最要紧，另外两块想到就加。','两天下来你会说几十次。回去以后换成你自己的活，照样这么说。'],ex:['[[帮我查一下陶陶居（在广州），再看「资料」文件夹，整理成一份企业档案]]','[[基于企业档案，帮我做一个单页官网，给想来吃早茶的客户看，看完让他打电话订位]]','[[基于企业档案，帮我写 3 段话术：客户留了电话以后，第一句怎么说]]']},
   quick:['把价目表、常见问题、照片拖进「资料」文件夹','说[[帮我查一下我的公司（在 XX 市），再看「资料」文件夹，整理成一份企业档案]]','等它查，一般 1 分钟','它问你的几处，对的不管，错的直接说','打开企业档案看一眼'],
   why:['AI 不认识你的公司，不给它资料，它只能瞎猜。','这一步给它一份企业档案。后面做官网、写话术，都照这份来。'],
   reveal:[['它从哪查的？','官网、公众号、地图和点评、工商信息、新闻。每条后面都写了出处。'],['海报写「读懂你的电脑」，它会扫电脑吗？','不会。它只看「资料」文件夹和网上公开的信息。'],['为什么非要老板核对？','它可能搜到同名的公司，或者网上的旧信息。价格、电话以老板说的为准。'],['网上搜不到怎么办？','小店很常见。让老板对着电脑说 3 分钟，它照样能整理出来。'],['它还顺手做了什么？','生成一份工作区规矩：以后每一步只用档案里的事实，不编价格。老板不用管。']],
   say:['帮我查一下 XXX（在 XX 市），再看「资料」文件夹，整理成一份企业档案。','电话不对，是 XXX。','价格不对，是 XXX 元。','同名的那几家都不是，我们是 XX 区那家。','网上搜不到我们，我说一下：……','还有哪些没查到？列给我。'],
   steps:[{n:'放资料',h:'把资料拖进「资料」文件夹',t:'价目表、常见问题、几张照片。价目表拍照也行。',shot:'资料文件夹',img:'assets/camp/a2-1.png'},{n:'说要求',h:'照句式让 AI 查你的公司',t:'比如[[帮我查一下陶陶居（在广州），再看「资料」文件夹，整理成一份企业档案]]。刚才它问过公司名和城市，这句话一起回答了。',shot:'回答公司名和城市',img:'assets/camp/a2-2.png'},{n:'等它查',h:'等它查',t:'一般 1 分钟左右，慢的四五分钟。'},{n:'看查到什么',h:'看它查到了什么',t:'比如陶陶居，它查到 1880 年创立、总店在第十甫路。右边能看到它查了哪些网页。',shot:'AI 查到的信息',img:'assets/camp/a2-4.png'},{n:'核对',h:'回答它问的几处',t:'比如它会问：你代表整个品牌，还是某一家门店？对的不管，错的直接说，它当场改。',shot:'核对和纠正',img:'assets/camp/a2-5.png'},{n:'看档案',h:'打开企业档案看一眼',t:'每条后面都写了出处。查不到的写着「待补」。',shot:'企业档案',img:'assets/camp/a2-6.png'}],
   pits:[['网上几乎搜不到','小店很常见。按住微信输入法说 3 分钟，它照样能整理'],['搜到好几家同名的','它会列出来，你说是哪家'],['价格跟你的不一样','以你交的价目表为准，直接告诉它'],['档案里好多「待补」','它不敢编才写待补。挑要紧的说给它，其余课后补'],['等了 10 分钟没动静','叫助教'],['写进了别人家的事','说[[这条不是我们，删掉]]']],
   done:['价格、电话、地址你都核对过','每条后面都有出处','查不到的写着待补，没有编的'],
   notes:[{h:'时间怎么分（共 50 分钟）',t:['讲师大屏演示，10 分钟。用悦姐的公司。','学员跟着做，25 分钟。AI 查一般 1 分钟，其余时间都在核对。','抽 2 个人分享，10 分钟。说说 AI 查到了哪些自己都忘了的事。','收尾，5 分钟。']},{h:'课前准备',t:['讲师前一天先演示一遍，留个备份。','助教检查每人交齐 3 样资料。']},{h:'可以讲的几句话',t:['AI 不认识你，它只会猜。','档案是后面所有东西的地基。','网上搜不到不丢人，正好说明你需要官网。','AI 说的，你都要核一遍。']},{h:'现场常见情况',t:['30 人同时查会变慢。慢的人先看大屏。','学员照抄了演示里的价格。让他删掉，换成自己的。','整份档案都是待补。让他对着电脑说 3 分钟。']},{h:'参考',t:['10-24 实测：GPT-6 Luna 查陶陶居，44 秒查完并整理好。','对应结营第 1 项：能答对自家价格。','改一项信息、同步到官网，放在 D2 上午 04 上线时练。']}]}},
  {id:'a3',no:'03',step:'2',t:'从 0 搭建第一个官网',poster:'从 0 搭建第一个官网 —— 让自己的产品和业务拥有独立展示入口',do:'告诉 Codex 官网给谁看、客户看完做什么、想做成什么样，再修改初稿并检查手机页面。',who:'柳',time:'10:30–11:20',body:{
   quick:['说[[基于企业档案，帮我做一个单页官网，给 XX 看，看完让他 XX]]','它问喜欢什么样，发一个参考网站或截图','等 Codex 在右边显示初稿','挑一处最不满意的，说清怎么改','切到手机宽度，逐个点按钮'],
   why:['客户听说你、搜到你后，最后会看到官网，所以首屏要让人看懂你是谁、做什么、下一步找谁。','今天不用花钱建站，Codex 能按企业档案写初稿，企业档案没有的信息不放。'],
   say:['基于企业档案，帮我做一个单页官网，给 XX 的客户看，看完让他打电话预约。','我喜欢这个网站的配色和留白：（贴链接或截图）','首屏的按钮太靠下，手机上一眼看不到，挪到标题下面。','这个颜色太暗，换成我们招牌上的红色。','这张图不是我们店，删掉。','切到手机宽度看一下，有没有字挤在一起、按钮点不了。'],
   steps:[{n:'说要求',h:'说出你要的官网',t:'比如[[基于企业档案，帮我做一个单页官网，给想来吃早茶的客户看，看完让他打电话订位]]。没说全的，它会用选择题卡片问你，点一个选项就行，也可以自己写。',shot:'回答 3 个问题',img:'assets/camp/a3-1.png'},{n:'发参考',h:'发参考网站或截图',t:'把链接或截图发给它，再说清楚喜欢它的颜色、排版、照片的感觉。它只学样子，不抄人家的内容。',shot:'发参考网站'},{n:'等初稿',h:'等 Codex 显示初稿',t:'右边可以直接预览，图片先用你交的照片。10-24 实测：从回答完 3 个问题到出官网，用了 3 分半。',shot:'初稿在右侧预览',img:'assets/camp/a3-2.png'},{n:'看首屏',h:'看首屏三件事',t:'首屏要让人一眼看懂三件事，下图 ① 是谁，② 做什么，③ 下一步点哪里。',shot:'首屏三件事',img:'assets/camp/a3-4.png'},{n:'改一处',h:'挑一处最不满意的地方改',t:'说清改哪、哪里不对、想改成什么样。一次只改一处，改完再说下一处。',shot:'改一处',img:['assets/camp/a3-5a.png','assets/camp/a3-5b.png']},{n:'查手机',h:'切到手机宽度检查',t:'自己点一遍按钮，确认电话能拨、地址正确、没有字挤在一起。它会先开浏览器按手机宽度检查，再告诉你检查过了。',shot:'手机宽度检查',img:['assets/camp/a3-6.png','assets/camp/a3-3.png']}],
   pits:[['只说[[不好看]]，它改了一堆还是不对','说清哪个位置、哪里不对、想改成什么样'],['不知道怎么开口','照句式说[[基于企业档案，帮我做一个官网]]，剩下的它会问你'],['一时想不出喜欢的样式','说[[你先按企业档案做，我再改]]'],['页面出现没给过的价格或评价','说[[这条企业档案里没有，删掉]]，它只能用企业档案里的事实'],['页面打开很慢','多半是图片太大，让它压缩图片，加起来别超过 1MB'],['改着改着把之前好的地方也改没了','说[[退回上一版]]，再改那一处'],['想加会员登录、在线支付','今天不做，记进课后清单'],['参考网站的内容被搬过来了','说[[只学样子，内容全部换成我的企业档案]]'],['有些位置没有照片','这些位置先用色块代替，下午再用 AI 生成配图'],['落后了，前面的没做完','说[[帮我把前面没做的补上，全班现在在做 XX]]，它会用默认做法快速补齐']],
   done:['首屏一眼能看出你是谁、做什么、下一步点哪里。','页面上的价格、电话、地址和企业档案一致，没有编出来的内容。','按你的意思改过至少一处。','手机宽度下页面不乱，按钮都点得动。'],
   notes:[{h:'时间怎么分（共 50 分钟）',t:['先用 5 分钟定给谁看、看完干什么，再定长什么样。','讲师演示，10 分钟。','学员一起做，30 分钟。30 人同时做会慢一些，其余时间改。','抽 1 人展示改前改后，5 分钟。']},{h:'可以讲的几句话',t:['长什么样由你定，事实以企业档案为准。','说不出好看在哪，就拿一个你喜欢的网站来。']},{h:'做法',t:['Codex 照企业档案直接写单页网站，学员电脑不用装别的软件。','小工具入口等下午做好了再加，不放空链接。']},{h:'现场常见情况',t:['整节都在挑颜色。先把事实和主按钮做对，细调放到下午。','学员说[[要高大上]]，追问是哪个网站、哪一点。']},{h:'参考',t:['10-24 实测：单人回答完 3 个问题到出官网，用了 3 分半。','对应结营 02：手机 4G 能打开，D2 上线后验。']}]}},
  {id:'a4',no:'04',step:'3',t:'提前布局 GEO 搜索',poster:'提前布局 GEO 搜索 —— 让官网更容易进入 AI 搜索与推荐结果',fix:'现场能做到的是把内容做好、放上官网。被 AI 搜索收录和推荐要等几周，不当场保证。今天放在 github.io 上是练手，国内的 AI 能不能读到没把握。要稳定被读到，课后迁到国内服务器并备案',do:'先问豆包和 DeepSeek 并截图，再生成常见问答和品牌介绍，最后把常见问答放到官网。',who:'悦姐 + 柳',time:'11:20–12:00',body:{
   quick:['说[[基于企业档案，帮我列 3 个客户会问 AI 的问题，至少 2 个不带店名]]','用豆包和 DeepSeek 提问并截图','同时让 AI 写常见问答和品牌介绍','核对答案，没依据的删掉','用手机查看官网问答'],
   why:['客户会先问 AI，再决定找哪家店。','客户会问的问题写清楚、写得有依据，AI 更容易读懂并说对。'],
   say:['基于企业档案，帮我列 3 个客户会问 AI 的问题，至少 2 个不带店名。','基于企业档案，帮我写一份常见问答和品牌介绍，放到官网上。','截图放好了，在「GEO/优化前截图」里。','这条答案不对，我们周末不营业。','这个问题我们答不了，删掉，别放到网上。','把常见问答放到官网首页下面。','品牌介绍再短一点，三句话说清是谁、在哪、做什么。'],
   steps:[{n:'出题',h:'让 AI 列 3 个客户问题',t:'说[[基于企业档案，帮我列 3 个客户会问 AI 的问题，至少 2 个不带店名]]。比如「广州哪家早茶适合带爸妈」「XX 一般多少钱」「XX 提供哪些服务」。',shot:'3 个留底问题',img:'assets/camp/a4-1.png'},{n:'手机留底',h:'用手机问豆包和 DeepSeek 并截图',t:'把 3 个问题分别问豆包和 DeepSeek，截图存进工作区的「GEO/优化前截图」，几周后再问一遍做对比。手机截图用微信「文件传输助手」发到电脑，再拖进去。',shot:'豆包的回答截图'},{n:'写内容',h:'让 AI 写常见问答和品牌介绍',t:'说[[基于企业档案，帮我写一份常见问答和品牌介绍，放到官网上]]。常见问答里的每条答案都要有企业档案依据。品牌介绍写清是谁、在哪、做什么、适合谁、怎么联系。',shot:'常见问答清单'},{n:'核答案',h:'核对答案',t:'不对的直接说，比如[[这条答案不对，我们周末不营业]]。没依据的让它删掉，宁可少，不要编。',shot:'核对答案'},{n:'放官网',h:'把常见问答放到官网',t:'它还会准备好给搜索引擎看的几样文件。网址先用占位的，明天上线后换成真的。',shot:'官网上的常见问答',img:'assets/camp/a4-5.png'},{n:'手机查看',h:'用手机看一下问答区排版',t:'手机宽度下排版不乱就行。AI 会写一份「分发清单」，列出品牌介绍以后可以发的平台，课后自己发。10-24 实测这一步用了 2 分 47 秒。',shot:'GEO 完成汇报',img:'assets/camp/a4-3.png'}],
   pits:[['手机上没有豆包或 DeepSeek','用讲师大屏的截图，注明不是自己问的，也可以课后补。'],['答案写得很好看，但我们其实做不到','说[[这个问题我们答不了，删掉，别放到网上]]。'],['问答只有几条，凑不够','不用凑，有几条写几条，缺少的资料记下来课后补。'],['问了 AI 还是搜不到我们','正常，今天只是准备内容，上线后要等几周才可能被收录。'],['官网首页被问答撑得很长','让它把问答做成点开才展开，或者单独放一页。'],['它问先继续还是等截图','可以选[[等你截完图再继续]]，也可以选[[先继续，截图课后补]]。']],
   done:['工作区的「GEO/优化前截图」里有 3 个问题的截图','官网上有常见问答，每条都能在企业档案里找到依据','有一篇品牌介绍，三句话说清是谁、在哪、做什么','页面上没有「保证排名」「第一」这类说法'],
   notes:[{h:'时间怎么分（共 40 分钟）',t:['悦姐主讲 GEO，先讲它是什么，再讲为什么现在要做。','柳在大屏同步操作 skill，学员跟着操作。']},{h:'课前准备',t:['开讲前，每人已有官网和企业档案。']},{h:'讲完每人有什么',t:['一个「GEO」文件夹。','里面有基线问题、优化前截图、常见问答、品牌介绍和分发清单。']},{h:'可以讲的几句话',t:['以后客户先问 AI，再找你。','答案有依据，AI 才敢引用。','今天是准备，不是保证排名。']},{h:'现场常见情况',t:['学员要求写「广州第一」，但档案里没有出处，不写。','没截图时，记「留底待验收（课后补截图）」，不影响继续做。']},{h:'参考',t:['实测发现，AI 出的 3 个留底问题都带了品牌名。','讲师提醒学员至少改 2 个不带品牌名的，例如「广州哪家早茶适合带爸妈」。','这样能看出客户还不知道你时，AI 会不会推荐你。','对应结营 02 要有官网常见问答和 GEO 优化前截图。']}]}}]},
 {id:'d1pm',icon:'1下',name:'D1 下午 · 做出能引流的钩子产品',full:'DAY 1 下午｜做出能引流的 AI 钩子产品',goal:'下午结束：一个能运行、能展示、能接流量的 AI 产品',items:[
  {id:'b1',no:'01',t:'看懂什么是真正的 AI 钩子产品',poster:'看懂什么是真正的 AI 钩子产品 —— 找到用户愿意点击、体验和转发的产品切口',do:'用 3 个案例和 5 种类型，讲清怎么用 AI 小工具让客户留下电话。',who:'柳',time:'13:30–13:50',body:{
   quick:['听讲师讲清钩子产品','看 3 个案例','认识 5 种小工具类型','从 5 种类型里选一种','写下客户最常问的话'],
   why:['客户不会因为官网就打电话，先给他一个用得上的小工具，他才愿意留下电话。','免费测肤、9.9 元体验课也是这个办法，AI 一小时就能做出这种小工具。'],
   say:['我是做 XX 的，客户最常问我「……」，请帮我想 3 个可以送给客户的小工具，每个都说清谁会用、用完得到什么，以及最后让他做什么。'],
   exTitle:'3 个案例',
   examples:[{h:'① 餐饮 · 早茶聚餐预算助手（计算 / 报价）',rows:[['谁用','来聚餐的客户'],['问什么','填写人数、场合、大厅或包间'],['得到什么','建议点几套'],['预算','给出大概花多少钱'],['最后','留电话订位']]},{h:'② 教培 · 孩子该报哪个班（测评 / 诊断）',rows:[['谁用','要给孩子报班的家长'],['问什么','填写年级、现在大概多少分、每周上课次数'],['得到什么','推荐适合的班'],['理由','附一句理由'],['最后','预约一节试听']]},{h:'③ 工厂 · 询价单生成器（生成器）',rows:[['谁用','来询价的采购'],['问什么','填写产品、规格、数量、交期'],['得到什么','一份整理好的询价单'],['最后','提交给业务员报价']]}],
   steps:[{n:'听概念',h:'听讲师讲清钩子产品',t:'讲师说，送客户一个好用的小东西，他用完顺手留个电话。'},{n:'看案例',h:'看 3 个案例',t:'每个案例只问 3 个问题，给 1 个结果，最后一步留电话。'},{n:'认类型',h:'认识 5 种小工具类型',t:'测评 / 诊断测一下适合哪种、计算 / 报价算一下要多少钱、生成器给出一份清单或方案、问答助手随时回答常见问题、预约 / 登记让客户填时间来店里。'},{n:'选类型',h:'选出最适合你的 1 种',t:'从 5 种类型里选 1 种，下一节挑这一种做。'},{n:'找问题',h:'写下客户最常问的话',t:'先写下客户最常问的那句话，再找出客户犹豫的那一步，那就是钩子的位置。'}],
   pits:[['我想做会员系统、小程序商城','今天只做小工具，会员系统和商城记进课后清单。'],['想不出客户会用什么','回想客户打电话最常问的第一句话，就从那句话做。'],['想不出 3 个小工具','把上面「照着说」那句发给 Codex，让它帮你想 3 个，下一节挑一个做。'],['担心结果不准，客户觉得被骗','结果只用企业档案里的价格和规则，页面写清「仅供参考，以实际为准」。']],
   done:['你能用一句话说清钩子产品','5 种类型里选好了 1 种','写下了客户最常问的那句话'],
   notes:[{h:'时间怎么分（共 20 分钟）',t:['讲师讲，20 分钟。','最后几分钟，让学员把「照着说」那句发给 Codex。']},{h:'课前准备',t:['3 个案例做成 3 页课件。','每页放一张真页面截图。']},{h:'可以讲的几句话',t:['先送，再要。','一个人、一件事、一个结果。','最后一步一定是留电话。']},{h:'参考',t:['餐饮那个在 10-05 实测做过。','对应结营 03 的前半段。']}]}},
  {id:'b2',no:'02',step:'4、5',t:'实战搭建自己的钩子产品',poster:'实战搭建自己的钩子产品 —— 从一个想法开始，现场做出可运行的产品原型',do:'AI 先问 3 个问题并写说明书，你确认后建一张客户收集表（腾讯文档或飞书都行）并放到最后一步，再生成小工具，随后请同桌当顾客检查。',who:'柳',time:'13:50–15:00',body:{
   quick:['说[[基于企业档案，帮我设计一个小工具，给 XX 用，用完知道 XX，最后让他 XX。先写说明书给我看]]','确认说明书里的规则','把客户表单链接放到最后一步','等 AI 生成小工具','请同桌从头点到尾'],
   why:['先写说明书，你点了头 AI 再动手，做出来才不偏。','同桌不靠你解释也能用完，客户才用得明白。'],
   say:['基于企业档案，帮我设计一个小工具：给来聚餐的客户用，用完知道该点几套、花多少钱，最后留电话订位。先写说明书给我看。','行。','这是我的客户表单链接：（粘贴链接），放到最后一步。','13 人以上别报价，提示打电话找店长。','结果页加一句「仅供参考，以门店实际为准」。'],
   exTitle:'2 个操作示例',
   examples:[{h:'示例 1 · 餐饮 · 早茶聚餐预算助手（10-05、10-24 两次实测）',rows:[['你说的','基于企业档案，帮我设计一个小工具：给来聚餐的客户用，用完知道该点几套、花多少钱，最后留电话订位。'],['说明书','类型是「计算 / 报价」。每 2 人估 1 套，向上取整，再乘以企业档案里的 168 元一套。9 人以上不报价，由门店确认。'],['做出来的样子','选「5 人」，显示约需 3 套、参考 504 元。页面写明「课程演示估算，不是门店正式报价」。'],['客户表单','最后一步是「复制订位摘要」和「打开飞书客户表单」。客户把摘要粘进表单，再留姓名和电话。'],['实测','10-24 用 GPT-6 Luna 生成，用了 10 分 19 秒。它自己核对了 2–8 人的算法，也检查了手机和电脑两种宽度。']]},{h:'示例 2 · 教培 · 孩子该报哪个班（同样步骤设计，未实测）',rows:[['你说的','基于企业档案，帮我设计一个小工具：给要报班的孩子家长用，用完知道适合哪个班、为什么，最后预约一节试听。'],['说明书','类型是「测评 / 诊断」，问几年级、现在大概多少分、每周能上几次。班型和价格只用企业档案里的。'],['预期样子','选「四年级、80 分左右、每周 2 次」，推荐提高班，附一句理由。档案里没有的班型不推荐，提示咨询老师。'],['客户表单','最后一步「预约试听」打开客户表单。'],['注意','不写「保证提分」这类承诺。只问成绩和时间，不收孩子的身份信息。']]}],
   steps:[{n:'说要求',h:'说出你要的小工具',t:'比如[[基于企业档案，帮我设计一个小工具：给来聚餐的客户用，用完知道该点几套、花多少钱，最后留电话订位。先写说明书给我看]]。没想好做什么，它会先推荐一个，10-24 实测推荐的是「到店问答助手」。',shot:'说出你要的小工具',img:'assets/camp/b2-1.png'},{n:'看说明书',h:'看完说明书并确认规则',t:'它会写清类型、问几个问题、结果长什么样、最后去哪。关键规则用选择题确认，例如「每 2 人估 1 套」，同意就点「按这个」。',shot:'确认算法',img:'assets/camp/b2-2.png'},{n:'放表单',h:'把客户表单放到最后一步',t:'它会问客户表单从哪来。用腾讯文档或飞书建一张收集表，助教发的模板可以直接复制一份。分享设成所有人都能填写，再说[[这是我的客户表单链接：（粘贴链接），放到最后一步]]。',shot:'贴上客户表单链接',img:['assets/camp/b2-4.png','assets/camp/b2-4b.png']},{n:'等生成',h:'等 AI 生成小工具',t:'10-24 实测生成用了 10 分 19 秒，等的时候可以休息。它会检查手机和电脑两种屏幕大小、核对算法、在官网加好入口，不会替你提交表单，真提交留到明天上线后用手机验。',shot:'小工具做完的汇报',img:'assets/camp/b2-5.png'},{n:'查结果',h:'自己检查计算结果',t:'选人数并点「计算套餐预算」。选择 5 人时，应显示约 3 套、504 元、写明「不是正式报价」，最后能复制摘要、打开客户表单。',shot:'算出来的结果',img:'assets/camp/b2-3.png'},{n:'同桌试',h:'请同桌当顾客从头点到尾',t:'你只观察，不解释。同桌卡住的地方，记下来告诉 AI 修改。',shot:'同桌互检'}],
   pits:[['AI 问的问题太多，客户嫌烦','说[[不影响结果的问题都删掉，最多 3 个]]'],['结果里冒出企业档案里没有的价格','说[[只用企业档案里的价格，没有的写请咨询]]'],['点到最后没有打开表单','检查表单链接是否复制完整，再让它把表单放到最后一步'],['表单提交了，客户表里没看到','今天先不管，明天上线后用手机再验一次'],['同桌说看不懂结果','让 AI 把结果改成一句大白话加一个数字'],['想做成会员系统','先做小版本，把原需求记进课后清单'],['客户说表单打不开、填不了','把收集表的分享设置改成所有人都能填写'],['说明书里的规则选错了','直接写出正确规则，不选错的那一项'],['落后了，前面的没做完','说[[帮我把前面没做的补上，全班现在在做 XX]]，它会用默认做法快速补齐']],
   done:['说明书已经确认','小工具能从头点到尾，只用企业档案里的价格和规则','最后一步能打开自己的客户表单','同桌没靠你解释就用完了'],
   notes:[{h:'时间怎么分（共 70 分钟）',t:['写说明书，15 分钟。','把客户表单放到最后一步，10 分钟。','生成小工具，25 分钟。AI 约 10–12 分钟，等的时候讲互检怎么做，也可以顺便休息。','同桌互检 15 分钟，收尾 5 分钟。']},{h:'课前准备',t:['助教准备好「客户表模板」，腾讯文档、飞书各一份，开课时发链接。','学员用哪个都行，复制一份到自己的账号里。']},{h:'可以讲的几句话',t:['先写说明书，再动手。','你会点不算，客户会点才算。']},{h:'参考',t:['这个示例在 10-05、10-24 做过两次实测。','10-24 实测：GPT-6 Luna 生成用了 10 分 19 秒。','对应结营 03：别人能用完，提交的信息进了客户表单。','真提交入库在 D2 上线后验。']}]}},
  {id:'b3',no:'03',t:'接入真实 AI 能力',poster:'接入真实 AI 能力 API —— 实战接入生图 API、生视频 API 与更多 AI 功能',fix:'海报写「生图 API、生视频 API」。现场：图用 Codex 自带的直接生成；视频是给 Codex 装 ChatCut 插件，把照片剪成一条简单短视频（是剪辑，不是凭空生成视频）',do:'用 Codex 生图，再给 Codex 装上 ChatCut 插件，把照片和生成的图剪成一条 15 秒竖版短视频。',who:'柳',time:'15:00–16:00',body:{
   verify:'ChatCut 这一段还没在我们的电脑上实测：装插件、登录、免费额度、中文字幕和导出下载，开课前讲师要走通一遍。官网给的英文安装口令是 /goal Read chatcut.io/chatgpt to install the ChatCut plugin and set up a new task for me.',
   quick:['说[[基于企业档案，帮我给小工具首屏生成一张图，暖色，不要文字，不要真人]]','再生成一张发朋友圈用的配图','在 ChatGPT 桌面版装 ChatCut 插件并登录','说[[用资料里的照片和刚才的图，剪一条 15 秒竖版视频]]','改字幕和音乐，导出后在手机上播一遍'],
   why:['AI 不只会写字，还能出图、剪视频。这一节两样都练一遍。','做出来的图和视频，官网、朋友圈、视频号都能直接用。'],
   say:['基于企业档案，帮我给小工具首屏生成一张图：一桌早茶，暖色，不要文字，不要真人。','这张太花了，换个干净点的背景。','再帮我生成一张发朋友圈用的竖版配图，不要文字。','请读一下 chatcut.io/chatgpt，帮我安装 ChatCut 插件。','用「资料」文件夹里的照片和刚才那两张图，剪一条 15 秒的竖版短视频，加字幕和轻快的音乐，结尾放店名和电话。','字幕放大一点，音乐换个安静的。','导出成 MP4，告诉我文件在哪里。'],
   steps:[{n:'首屏图',h:'让 Codex 生成一张首屏图',t:'说清用在哪、什么风格，再说不要文字、不要真人。Codex 自带生图，几十秒出一张，也可能一次给你几张挑。',shot:'Codex 生成的图',img:'assets/camp/b3-1.png'},{n:'放进页面',h:'挑好图，让它压缩后放进官网或小工具',t:'10-24 实测：一张图约 2.6MB，存进文件夹花了好几分钟。急用时右键图片选「在资源管理器中打开」，直接拖进工作区更快。',shot:'放进页面的效果和右键菜单',img:['assets/camp/b3-3.png','assets/camp/b3-2.png']},{n:'朋友圈图',h:'再生成一张朋友圈配图',t:'竖版，不要文字，字留到发朋友圈时再配。换两三种说法试试，看哪种描述出的图最像你家。'},{n:'装插件',h:'在 ChatGPT 桌面版装 ChatCut',t:'左边栏打开「插件」，搜 ChatCut 点安装。第一次用要登录课前注册的免费账号。网页版和手机版装不了。',shot:'插件里找到 ChatCut',img:'assets/camp/b3-4.png'},{n:'剪视频',h:'说[[用资料里的照片和刚才的图，剪一条 15 秒竖版视频]]',t:'加字幕和轻快的音乐，结尾放店名和电话，不加复杂特效。',shot:'剪好的时间线'},{n:'改成片',h:'对 Codex 说要改哪里',t:'比如[[字幕放大一点，音乐换个安静的]]。图片顺序也能改，改到满意为止。',shot:'改字幕或音乐'},{n:'导出',h:'导出 MP4，在手机上播一遍',t:'存进工作区。想发视频号、抖音，课后直接用这条。',shot:'手机上播放'}],
   pits:[['图里出现乱码文字','对 Codex 说[[图里不要任何文字，字留到网页上再加]]'],['图生成了，好几分钟还没放进页面','先等它写完，急用时右键图片选「在资源管理器中打开」或「下载副本」，把图拖进工作区，再对它说[[图在这里，压缩后放到小工具首屏]]。'],['生成的图像有真人，或像别人家的店','删掉重来，生成图只做氛围，不能冒充实拍。'],['插件里搜不到 ChatCut','确认使用的是 ChatGPT 桌面版，网页版和手机版不能装，仍然找不到就叫助教。'],['它说要花 ChatCut 积分，或要上传素材','先停下问助教，不要自己充值，等讲师确认免费版后再继续。'],['视频剪得太花、特效太多','对 Codex 说[[只要照片轮播加字幕和音乐，别的都不要]]'],['找不到导出的视频','对它说[[请告诉我文件在哪里]]，仍找不到就在 ChatCut 网页上打开同一个项目导出。']],
   done:['官网或小工具首屏用上了一张 Codex 生成的图','有一张朋友圈配图','手机能播放一条 15 秒左右的竖版短视频','你能说出接入外部能力的方法：先装插件、登录账号，再开口提要求'],
   notes:[{h:'时间怎么分（共 60 分钟）',t:['讲 AI 能出图、能剪视频，5 分钟。','生图 20 分钟。首屏图 10 分钟，朋友圈配图 10 分钟，多换几种说法试。','装插件并剪视频，30 分钟。','导出、手机播放、收尾，5 分钟。']},{h:'课前准备',t:['每人注册 ChatCut 免费账号，课前准备 0.3。','讲师备一套演示素材。']},{h:'可以讲的几句话',t:['AI 不只聊天，还能出图、剪视频。','插件就是给 Codex 加本事，装上就能用。']},{h:'现场常见情况',t:['ChatCut 要花积分、云端渲染或上传私有素材时，先停下问助教。','免费版够不够，等实测后再定口径。']},{h:'参考',t:['10-24 实测：陶陶居演示生图并放进页面共用 9 分半，大部分时间花在把图存进文件夹，右键「在资源管理器中打开」能省几分钟。','安装方法和免费额度来自 ChatCut 官网，2026-10-24 查阅。','官网说明免费版不用绑卡，含基础剪辑和导出、AI 字幕和音乐，网页导出累计 60 分钟。','对应结营 04：用上了 Codex 生成的图，剪出一条短视频。']}]}},
  {id:'b4',no:'04',step:'8',t:'56 个岗位型 AI 军师',poster:'搭建 56 个岗位型 AI 军师模板 —— 销售、文案、运营、朋友圈等场景随时调用',do:'让 Codex 写 3 段自家话术，再认识一下 56 个岗位军师，挑一个试一次。',who:'柳',time:'16:10–16:30',body:{
   quick:['说[[基于企业档案，帮我写 3 段话术：客户留了电话以后，第一句怎么说]]','念一遍，不像你说话的地方让它改','在 56 个军师里挑一个，试一次'],
   why:['客户留了电话后，第一句话会影响成交。','话术和军师都提前准备好，遇到问题时不用临时想。'],
   say:['基于企业档案，帮我写 3 段话术：客户留了电话以后，第一句怎么说。','话术里加一段：客户说「我再考虑一下」怎么接。','叫嫌贵应对军师：客户说太贵了，产品是招牌套餐。','这句太客气了，改成我平时说话的口气：……'],
   steps:[{n:'说要求',h:'说出要写的话术',t:'说[[基于企业档案，帮我写 3 段话术：客户留了电话以后，第一句怎么说]]。10-24 实测默认写小工具首次回访、问价后没下文、邀请老客回店三段，每段有电话版和微信版，1 分半写完。',shot:'选话术场景',img:'assets/camp/b4-1.png'},{n:'看话术',h:'看它写好的话术',t:'每段有开场白、客户常见的 3 种回答怎么接、收尾、不要说什么。',shot:'写好的话术',img:'assets/camp/b4-2.png'},{n:'念顺口',h:'念一遍，改成你的口气',t:'不像你说话的地方，说[[这句太客气了，改成我平时说话的口气：……]]。'},{n:'试军师',h:'在下面 56 个军师里挑一个试一次',t:'点「复制提示词」粘贴给 Codex，或者直接说[[叫嫌贵应对军师：客户说两个人 168 太贵了]]。10-24 实测 18 秒交回 3 个版本，价格只用了档案里的。',shot:'军师交回的结果',img:'assets/camp/b4-3.png'}],
   pits:[['话术太书面，不像我说话','给它一段你平时真实说过的话，说[[照这个口气改]]。'],['军师交回来的价格不对','它只能用档案里的价格，档案错了先改档案。'],['卡上【】里的内容没换就发出去了','它会先问你要，按它问的补上就行。'],['56 个太多，不知道用哪个','先从首次回访、嫌贵应对、朋友圈文案这 3 个开始。'],['不想复制提示词','直接说[[叫嫌贵应对军师]]，实训营助手会自己找到这张卡。']],
   done:['3 段自家话术念着顺口','用过 1 个军师，交回的结果能直接用'],
   junshi:true,
   notes:[{h:'时间怎么分（共 20 分钟）',t:['写话术并改顺口，10 分钟。','介绍军师库，3 分钟。','学员挑一个军师试一次，5 分钟。','收尾，2 分钟。']},{h:'军师库分类',t:['销售 8 个、客服与售后 7 个、文案 7 个、短视频与新媒体 8 个。','私域与社群 6 个、店长与门店 6 个、招聘与人事 5 个、报价采购与经营分析 5 个。','招商 2 个、教务 2 个。']},{h:'军师卡规矩',t:['每个军师只处理一件具体的事，提示词已经写好。','每张卡都先读企业档案，缺信息先问，最多 3 个问题。','价格和优惠只用企业档案里的内容，规矩里不许编。','交付格式固定，字数都在 350 以内。']},{h:'参考',t:['10-24 实测：默认 3 段场景是小工具首次回访、问价后没下文、邀请老客回店，每段有电话版和微信版，约 1 分半写完。','10-24 实测：嫌贵应对军师 18 秒交回 3 个版本，价格只用了档案里的。','部分参考 agency-agents-zh 和它的上游 agency-agents，都是 MIT 许可，署名放在 skill 包的「军师库-NOTICE」里，原来的 56 条开场白用作场景来源。','对应结营 05 要完成 3 段话术并用过 1 个军师。','用顺手的军师，D2 上午学了举一反三以后，可以存成自己的 skill。']},{h:'现场提醒',t:['简历初筛军师会碰到候选人的姓名和电话，课上提醒先删掉身份证号和住址。']}]}},
  {id:'b5',no:'05',step:'7',t:'完成第一个微信小程序',poster:'完成第一个微信小程序 —— 把产品接入微信生态，承接流量与用户',fix:'现场做的是测试号样品，只有自己能扫码打开；正式上架给客户用，课后约 2–4 周',do:'从 5 种小程序里选一种让 Codex 做，再在微信开发者工具里用测试号打开，手机扫码看。',who:'柳',time:'16:30–17:30',body:{
   verify:'只有 ③（小工具搬进小程序）有现成骨架、测过代码；①②④⑤ 的骨架开课前要补齐并实测。「使用测试号」的位置是照官方文档和网上教程写的，示意图要换成拓涵的实拍图。',
   quick:['从 5 种里挑一种，照句式说给 Codex','打开微信开发者工具，导入「小程序」文件夹','AppID 选「使用测试号」，点确定','点「预览」，用手机微信扫码打开'],
   why:['客户都在微信里，小程序能让他们直接打开你的东西。','今天用测试号做样品。测试号是微信给每个人的免费试用身份，做出来的小程序只有你自己能扫码看，给客户用要课后另外申请上架。'],
   say:['我要做第 1 种，门店名片。','我要做第 3 种，把下午的小工具做成小程序。','我想做一个……（说你的需求），先对照今天的限制，看看能做哪种。','电话按钮点了没反应，帮我查一下。','把标题改成我们的店名，颜色用官网的主色。'],
   exTitle:'5 种小程序，挑一种（复制那段话发给 Codex）',
   examples:[{h:'① 门店名片（内容最少，最容易做）',rows:[['做出来','店名、一句话介绍、3 张照片、营业时间。地址一点就导航，电话一点就拨打'],['照着说','帮我做一个门店名片小程序：店名、一句话介绍、3 张照片、营业时间，地址能一键导航，电话能一键拨打。内容只用企业档案里的。']]},{h:'② 价目单',rows:[['做出来','产品和价格列表，点开看详情，底部一键拨号'],['照着说','帮我做一个价目单小程序：列出档案里的产品和价格，点开能看包含什么，底部一个「电话咨询」按钮。档案里没有价格的写「请咨询」。']]},{h:'③ 小工具（下午那个搬进来）',rows:[['做出来','和网页版一样，问 3 个问题出结果，最后复制留资链接或一键拨号'],['照着说','把下午做的小工具做成小程序版：问题和结果跟网页版一致，最后一步改成「复制预约链接」和「一键拨号」。']]},{h:'④ 常见问答',rows:[['做出来','客户最常问的问题，点开看答案；答不了的一键拨号'],['照着说','帮我做一个常见问答小程序：用档案里的常见问题和答案，点开展开，最下面放「还有问题？打电话问」按钮。']]},{h:'⑤ 预约登记',rows:[['做出来','选服务、选日期时段、填称呼，生成一段预约信息，一键复制后发微信或拨电话'],['照着说','帮我做一个预约登记小程序：选服务、选日期和时段、填称呼，最后生成一段预约信息，能一键复制，旁边放一键拨号。不用真的提交到后台。'],['注意','测试号样品不接后台，信息不会自动进客户表，靠客户复制发给你']]}],
   steps:[{n:'选类型',h:'从 5 种里选一种，照句式说给 Codex',t:'比如[[基于企业档案，帮我做一个门店名片小程序，用测试号]]。上面「照着说」里有 5 种的现成说法，拿不准就选①，内容最少。',shot:'选一种发给 Codex'},{n:'等生成',h:'等 Codex 做好',t:'10-24 实测门店名片不到 2 分钟，档案里没有的营业时间会写「待补」。做好的文件在工作区的「小程序」文件夹。它不用你给 AppID，下一步在开发者工具里点一下就有。',shot:'Codex 说小程序做好了'},{n:'导入',h:'打开微信开发者工具，点「导入」',t:'用课前登录过的那个微信扫码登录。选「小程序」，点「导入」，目录选工作区里的「小程序」文件夹。',shot:'导入项目'},{n:'测试号',h:'AppID 一栏选「使用测试号」，点「确定」',t:'不用去别的网站申请，点一下就自动填好，这个号就是你的测试号。下图是示意图，以实际界面为准。',shot:'AppID 下面的「使用测试号」（示意图）',img:'assets/camp/b5-testid-demo.png'},{n:'模拟器',h:'先在左边模拟器里看一遍',t:'点点电话、导航按钮。模拟器里有些按钮不响应，以手机上为准。',shot:'开发者工具里的模拟器'},{n:'手机预览',h:'点右上角「预览」，用手机微信扫码',t:'扫码的微信要和登录开发者工具的是同一个号。手机上确认电话能拨、地址能导航，文字不挤。',shot:'手机上打开小程序'},{n:'准备收尾',h:'收尾时让 AI 先填变现路径表',t:'17:30–18:00 说[[基于企业档案、小工具和话术，帮我填一张变现路径表初稿]]，晚上悦姐讲时直接在上面改。'}],
   pits:[['找不到「使用测试号」','先确认开发者工具已经扫码登录。还是没有，就打开 mp.weixin.qq.com/wxamp/sandbox?doc=1，用微信扫码拿一个测试号，把页面上的 AppID 复制进 AppID 一栏。'],['选成了「游客模式」','游客模式不能在手机上预览。重新导入，AppID 选「使用测试号」。'],['扫码提示没有权限或打不开','扫码的微信要和登录开发者工具的是同一个号。还不行就先在模拟器里看，手机扫码课后补。'],['想要在线支付、会员积分、商城','缩成①或②，原需求记进课后清单，测试号今天做不了这类商业功能。'],['想把网页直接塞进小程序','个人和测试号不能直接嵌网页，让 AI 照同样内容重做一份小程序版。'],['电话或导航按钮点了没反应','模拟器里有些按钮不响应，以手机上为准，手机上也不行就 [[让 AI 查一下]]。'],['它做了 5 个页面，越做越大','说[[只要一页，别的都删掉]]。'],['5 种拿不准','先选①，它的内容最少。'],['自己的需求不在 5 种里','直接说自己的需求，不用套示例，再按「缩小需求」这一步处理。']],
   done:['自己的手机微信能打开小程序','小程序里的价格、电话、地址与企业档案一致','电话或导航至少有一个能用','你能说出选了哪一种，也能说出选择原因'],
   notes:[{h:'时间怎么分（共 60 分钟）',t:['讲小程序的作用和今天的边界，5 分钟。','选型和生成，25 分钟。选型 5 分钟，生成 20 分钟。','开发者工具导入和手机扫码，20 分钟。','收尾，10 分钟。']},{h:'今天的边界（开场就讲清）',t:['只做一个小东西，最多 3 页。','不登录、不支付、不做会员和后台。','不收身份证等敏感信息，内容只从企业档案取。','测试号样品只有自己能扫。']},{h:'课前准备',t:['每人提前在微信开发者工具扫码登录，课前准备 0.5。','助教备一份做好的①样品，作为现场备用。']},{h:'参考',t:['10-24 实测：门店名片生成用了不到 2 分钟。','对应结营 06：测试号手机扫码能打开。','测试号官方说明：developers.weixin.qq.com/miniprogram/dev/devtools/sandbox.html，备用申请页 mp.weixin.qq.com/wxamp/sandbox?doc=1。']}]}}]},
 {id:'d1ev',icon:'1晚',name:'D1 晚上 · 把钩子产品变成钱',full:'DAY 1 晚上｜把你的钩子产品变成钱（19:30–21:30，顺序和时长悦姐定）',goal:'晚上结束：产品不是做出来就结束，而是要让它成为你的生意入口',items:[
  {id:'c1',no:'01',t:'拆解 AI 产品商业闭环',fix:'海报写「媛姐」，就是悦姐，海报定稿时改字',poster:'媛姐拆解 AI 产品商业闭环 —— 从「做出来」走到「有人用、有人买、能成交」',do:'悦姐讲，内容悦姐定',who:'悦姐',time:'悦姐定'},
  {id:'c2',no:'02',step:'9',t:'设计钩子产品的变现路径',poster:'设计钩子产品的变现路径 —— 明确免费入口、付费产品、成交路径与后续交付',do:'让 AI 填好变现路径表初稿，学员边听悦姐讲边改，讲完交给助教。',who:'悦姐',time:'悦姐定',body:{
   quick:['下午收尾说[[基于企业档案、小工具和话术，帮我填一张变现路径表初稿]]','晚上听悦姐讲时直接改初稿','拿不准的格子标「待老板定」','讲完说[[整理一下变现路径表]]并交表'],
   why:['官网和小工具带来免费客户，变现路径表帮你把付费产品卖出去。','AI 先填好初稿，你听悦姐讲时能直接修改。'],
   say:['基于企业档案、小工具和话术，帮我填一张变现路径表初稿。','付费产品改成 XXX。','成交在微信里，我自己接。','定价那一栏先空着，我回去再想。','整理一下变现路径表，我要交了。'],
   steps:[{n:'填初稿',h:'下午收尾让 AI 填初稿',t:'说[[基于企业档案、小工具和话术，帮我填一张变现路径表初稿]]。表里写免费入口、付费产品、成交地点、交付方式和定价。',shot:'变现路径表初稿'},{n:'边听边改',h:'在 Codex 里说[[付费产品改成……]]',t:'晚上听悦姐讲，讲到哪儿就改到哪儿。'},{n:'标成待定',h:'把拿不准的格子标成「待老板定」',t:'先空着，不硬填。'},{n:'整理交表',h:'交表前说[[整理一下变现路径表]]',t:'Codex 整理好后，把表交给助教。'}],
   pits:[['它填了一个我没有的产品','对 AI 说[[这个产品我们没有，删掉]]'],['想新加产品或价格','直接告诉 AI'],['定价不知道写多少','先空着并标「待老板定」，回去想好再填']],
   done:['5 栏都有内容或「待老板定」','价格来自企业档案或你亲口定的，没有 AI 编的','变现路径表已交给助教'],
   notes:[{h:'时间安排',t:['17:30–18:00，AI 填好变现路径表初稿。','晚上听悦姐讲时修改初稿。','讲完整理并交表。']},{h:'讲师备注',t:['这一段的内容由悦姐定。','学员手上的任务就是填写变现路径表。']},{h:'前提',t:['D1 下午的小工具和话术已完成。']},{h:'参考',t:['对应结营 07。']}]}},
  {id:'c3',no:'03',t:'拆解 AI 增值新商业体系',poster:'拆解 AI 增值新商业体系 —— C 端引流 + B 端成交 + AI 体系持续增值',do:'悦姐讲，内容悦姐定',who:'悦姐',time:'悦姐定'},
  {id:'c4',no:'04',t:'把 AI 能力包装成商业产品',poster:'把 AI 能力包装成商业产品 —— 让技术、内容、流量与成交真正连成一条线',do:'悦姐讲，内容悦姐定；柳讲 20 分钟案例',who:'悦姐 + 柳',time:'悦姐定'}]},
 {id:'d2am',icon:'2上',name:'D2 上午 · 让 AI 进入手机和办公',full:'DAY 2 上午｜让 AI 进入你的手机和日常办公',goal:'上午结束：一个手机随时可调用的 AI 员工，并完成核心项目上线',items:[
  {id:'e1',no:'01',step:'10',t:'手机控制 AI',poster:'用 DeepSeek 实现手机控制 AI —— 随时随地调用 AI、处理工作和项目任务',fix:'海报写 DeepSeek。实际用 Hermes（爱马仕），它的脑子用你的 ChatGPT 会员（和 Codex 同一个账号），不用 DeepSeek。电脑要开着，手机才指挥得动',do:'让 Codex 把 Hermes 装好配好，你扫码绑定飞书或微信，再用手机发一条消息。',who:'柳',time:'09:00–09:50',body:{
   verify:'Hermes 这一节还没在我们的电脑上从头走过：安装、接模型、扫码接飞书或微信、开机自启和手机回话，开课前讲师要实测并补截图。',
   quick:['说[[帮我装 Hermes，用我的 ChatGPT 订阅登录，配好以后连到我的飞书]]','浏览器弹出 ChatGPT 登录，用你的账号登录确认','用飞书或微信扫码绑定','照 Codex 的提示处理完','手机发一条消息，收到回复就算完成'],
   why:['Hermes 装在电脑上并一直运行，电脑开着且不休眠时，你用手机就能让 AI 干活。','它用你的 ChatGPT 会员，也就是 Codex 那个账号，不用另花钱，也不用申请密钥。'],
   say:['帮我装 Hermes（爱马仕），用我的 ChatGPT 订阅登录，配好以后连到我的飞书。','我用微信，帮我连到微信。','设成只有我能指挥它，别人发消息不理。','让它开机自动运行，电脑重启也能用。','手机发消息没回复，帮我看看哪里不对。'],
   steps:[{n:'交给 Codex',h:'说[[帮我装 Hermes，用我的 ChatGPT 订阅登录，配好以后连到我的飞书]]',t:'Codex 会自己装好 Hermes，再接上你的 ChatGPT 订阅，不用你在终端里敲命令。大约 5 到 10 分钟。',shot:'Codex 正在装 Hermes'},{n:'登录确认',h:'在浏览器里登录 ChatGPT 确认',t:'Codex 会打开一个网址，给你一串验证码。填上验证码，再用你的 ChatGPT 账号登录。用的就是 GPT 官网的订阅，登录这一下要你本人来。',shot:'登录 ChatGPT 确认'},{n:'扫码绑定',h:'用飞书或微信扫码绑定',t:'Codex 会给你一个二维码。飞书用飞书手机 App 扫，会自动建好机器人。微信用微信扫，再在手机上确认。',shot:'扫码接飞书或微信'},{n:'处理完',h:'照 Codex 的提示处理完',t:'它会把你设成唯一能指挥的人，设好开机自动运行，还可能请你把电脑设成插电时不睡眠。照它说的点就行。',shot:'Codex 提示配置完成'},{n:'手机测试',h:'手机发一条消息',t:'在飞书或微信里给机器人发[[你好，你是谁]]。电脑上的 AI 回你了，就算完成。',shot:'手机上收到回复'}],
   pits:[['安装卡住或报网络错误','换讲师热点，再让 Codex 装一次。还不行就举手叫助教。'],['验证码过期了','让 Codex 重新生成一个。'],['飞书扫码后没反应','确认手机飞书登录的是你自己的账号，还不行请助教帮你手动建应用。'],['二维码显示成乱码','让 Codex 把二维码的网址发给你，在浏览器里打开再扫。'],['手机发消息没回复','先看电脑是不是睡眠了，再让 Codex 查一下 Hermes 是不是在运行。'],['微信机器人拉不进群','正常，微信这种机器人基本只能私聊。要在群里用就选飞书。'],['用公司飞书扫码，提示要管理员审批','课上先用自己注册的个人飞书。'],['电脑上本来就装着 Hermes 在用，Codex 说要修复或重装','先停下叫助教，别让它修。那可能是你在用的另一套，修了会影响原来的设置。']],
   done:['手机上发一句消息，电脑上的 AI 回复了。','只有你自己能指挥它。','它设好了开机自动运行。设了开机密码的电脑，开机后要先登录进系统它才会启动。'],
   notes:[{h:'时间怎么分（共 50 分钟）',t:['讲 Hermes 是什么、为什么电脑要开着，5 分钟。','Codex 安装并接上 ChatGPT 订阅，15 分钟。','扫码绑定飞书或微信，15 分钟。','照提示处理完、手机测试，15 分钟。']},{h:'课前准备',t:['开课前在讲师电脑完成整套测试。','用讲师自己的实测截图替换截图位置。','飞书官网和 CSDN 上的教程只作参考，不直接搬里面的截图。']},{h:'官方文档',t:['依据 Hermes 官方文档，2026-10-24 查阅，Windows 原生 PowerShell 可装，官网另有桌面版安装包。','模型用 hermes model 选「ChatGPT or Codex Subscription」，再通过验证码登录。','飞书推荐扫码自动建应用，手动建应用是备用办法，默认建议用飞书，因为它能进群。','微信使用腾讯官方 iLink 机器人，基本只能私聊，默认谁都能发消息，必须设置允许名单。']},{h:'现场常见情况',t:['30 人同时下载会变慢，开始安装前先确认能打开 Hermes 官网。','现场准备讲师热点。']},{h:'参考',t:['10-24 实测碰到过电脑已经装好 Hermes、正在使用的情况，Codex 提出修复或重装。','对应结营 08 的前半段。']}]}},
  {id:'e2',no:'02',step:'10',t:'搭建一个协助办公的 AI 员工',poster:'搭建一个协助办公的 AI 员工 —— 让 AI 帮助整理信息、执行任务与推进工作',do:'继续上一节，在 Codex 里生成「员工手册」并装进 Hermes，在手机上问价答对就算上岗。',who:'柳',time:'09:50–10:20',body:{
   verify:'员工手册装进 Hermes、手机上问价答对，这一整套还没实测。',
   quick:['在 Codex 里说[[基于企业档案和话术，帮我写一本员工手册，装进 Hermes]]','核对「员工手册」里的价格','让 Codex 把「员工手册」装进 Hermes','在手机上问招牌套餐价格','再让它写一条朋友圈'],
   why:['「员工手册」让 Hermes 知道公司信息、价格和说话规矩。','在手机上问价答对，才说明这个 AI 员工已经能协助办公。'],
   say:['基于企业档案和话术，帮我写一本员工手册，装进 Hermes。','把员工手册装到 Hermes 里。','（手机上）我们的招牌套餐多少钱？','（手机上）帮我写一条邀请老客户回店的朋友圈。','（手机上）按员工手册回答。','员工手册里的价格改成 XXX 元，再装一次。'],
   steps:[{n:'确认连接',h:'用手机发一句话',t:'电脑上的 Hermes 要回你。'},{n:'生成手册',h:'让 Codex 写员工手册',t:'说[[基于企业档案和话术，帮我写一本员工手册]]。它会看企业档案和第一天写的 3 段话术，整理出一本「员工手册」，里面有公司信息、价格表、常见问题及答案、3 段话术、员工规矩。规矩是不编价格，答不了就说「我请老板回复您」。',shot:'员工手册'},{n:'核对手册',h:'看一遍「员工手册」',t:'价格和企业档案一致后，说[[行]]。',shot:'核对员工手册'},{n:'安装手册',h:'让 Codex 把「员工手册」装进 Hermes',t:'它会把「员工手册」做成 Hermes 能用的技能文件，再复制到 Hermes 的「skill 文件夹」。装好后，在终端依次输入「hermes gateway stop」和「hermes gateway start」，完成 Hermes 重启。',shot:'技能装进 Hermes'},{n:'手机问价',h:'在手机上问招牌套餐价格',t:'比如问[[我们的招牌套餐多少钱？]]。答对就说明它真的读了员工手册。',shot:'手机上答对价格'},{n:'试写文案',h:'再让它写一条朋友圈',t:'看看写出来的语气对不对。',shot:'朋友圈文案'}],
   pits:[['手机发一句话，Hermes 没回复','回上一节，先让手机发一句话，电脑上的 Hermes 能回你。'],['手机上问价格，它答错或者说不知道','先说[[按员工手册回答]]，还错就回 Codex 检查技能文件是否装进 Hermes，并确认 Hermes 已经重启。'],['它编了一个优惠','在 Codex 里说[[员工手册加一条：档案里没有的优惠一律不说]]，再让 Codex 装一次。'],['改了价格，它还按旧的说','改完档案后，在 Codex 里重新生成「员工手册」并装进 Hermes，完成后重启 Hermes。'],['朋友圈的口气不对','在手机上直接说[[语气再亲切一点]]。'],['客户也能找到这个 AI 员工吗','现在只听你一个人的，上一节已设允许名单，是否开放给客户可以课后再决定。']],
   done:['在手机上问价格，它答对了。','朋友圈文案符合你家的口径，没有编出来的优惠。','你知道改档案后，先在 Codex 里重新生成「员工手册」，再装进 Hermes 并重启 Hermes。'],
   notes:[{h:'时间怎么分（共 30 分钟）',t:['讲这一步，3 分钟。','生成员工手册，10 分钟。','装进 Hermes 并重启，7 分钟。','用手机测试，10 分钟。']},{h:'课前准备',t:['D2 上午 01 已让手机能指挥电脑上的 Hermes。','D1 下午 04 已写好话术。']},{h:'可以讲的几句话',t:['它是新员工，得先给它员工手册。','答不了就说请老板回复，比乱答强。']},{h:'安装提示',t:['安装时可以让 Codex 代为完成 Hermes 重启。']},{h:'参考',t:['对应 skill 第 10 步，模板是「员工手册模板」和「hermes 员工 skill 模板」。','Hermes 的 skill 文件夹是「~/.hermes/skills/」。','对应结营 08，手机上问价格答对。']}]}},
  {id:'e3',no:'03',step:'11、12',t:'掌握举一反三的 AI 应用方法',poster:'掌握举一反三的 AI 应用方法 —— 不止会使用一个工具，而是学会自己解决问题',do:'教 AI 做一件常做的小事，换一份资料再做一次，做对后保存成自己的 skill，装给 AI 员工后可用手机一句话触发。',who:'柳',time:'10:30–11:30',body:{
   verify:'手机上一句话触发 skill 这一步还没实测，要先走通 01、02。',
   quick:['先在手机上问价，确认 AI 员工答对','挑一件常干的小事，默认整理今天的新客户','照句式说出这件小事，再一句一句教它','说[[把刚才这件事保存成我的 skill]]','新开对话换资料复测，再装给 AI 员工用手机触发'],
   why:['这一节教你把反复做的小事交给 AI，以后不用每次从头教。','保存成 skill 并装给 AI 员工后，出门在外用手机发一句话，电脑就能按你的规矩完成并发回结果。'],
   say:['基于这份客户表，帮我整理今天的新客户：列出要回访的人，每人写一句开场白。','不对，月饼礼盒 5 盒以上的算重要客户。','开场白要带客户的称呼，后半句按他的需求写。','把刚才这件事保存成我的 skill，名字叫「今日回访名单」。','（新对话里）今日回访名单，用这份新的客户表单。','把这个 skill 装给 AI 员工。','（手机上）今日回访名单。'],
   exTitle:'5 件可以练的小事，挑一件',
   examples:[{h:'① 通用 · 整理今天的新客户（默认）',rows:[['给它什么','客户表单导出的表格'],['没有表怎么办','用示例表'],['标准结果','今天要回访的名单，写明姓名、电话、需求'],['每人加什么','一句开场白']]},{h:'② 美业 / 门店 · 明天的到店提醒',rows:[['给它什么','预约记录截图或表格'],['标准结果','明天到店名单'],['每人加什么','一条提醒消息']]},{h:'③ 工厂 / 贸易 · 询价整理成报价单',rows:[['给它什么','一段询价聊天记录'],['标准结果','一份标准报价单，写明品名、规格、数量、单价、交期'],['单价怎么取','只用价目表'],['交期没有怎么办','写待确认']]},{h:'④ 教培 · 课后反馈变家长周报',rows:[['给它什么','老师写的几句课堂记录'],['标准结果','一份给家长的周报，写明学了什么、表现、下周重点、家长怎么配合']]},{h:'⑤ 通用 · 语音变待办',rows:[['给它什么','老板的一段语音转成的文字'],['标准结果','一份待办清单，写明谁、做什么、哪天之前'],['没说截止时间怎么办','标待定']]}],
   steps:[{n:'先查状态',h:'先确认 AI 员工已经上岗',t:'在手机上问价，答案能对上。'},{n:'挑件小事',h:'从 5 件小事里挑一件',t:'默认选「整理今天的新客户」，用课上发的示例客户表单。照句式说，比如[[基于这份客户表，帮我整理今天的新客户：列出要回访的人，每人写一句开场白]]。',shot:'说清要干的事'},{n:'教到满意',h:'看第一版，一次改一处',t:'比如[[月饼礼盒 5 盒以上算重要客户]]。教到满意为止，它会把你纠正的规矩都记下来。',shot:'第一版和你的纠正'},{n:'保存规矩',h:'说[[把刚才这件事保存成我的 skill]]',t:'给它起个名字，比如「今日回访名单」。它会写一份 skill，把你纠正过的规矩写进去。',shot:'skill 文件'},{n:'换表复测',h:'新开对话，换一份客户表单',t:'说[[今日回访名单]]，再给一份新的客户表单。只有它照着规矩做对了，这次复测才算成功。',shot:'新对话里做对'},{n:'装给员工',h:'说[[把这个 skill 装给 AI 员工]]',t:'它会复制到 Hermes 的「skill」文件夹，并提醒你重启 Hermes。',shot:'装给 AI 员工'},{n:'手机触发',h:'在手机上发[[今日回访名单]]',t:'电脑会自己完成这件事，再把结果发回你的手机。',shot:'手机收到名单'}],
   pits:[['挑的事太大，比如「帮我做经营分析」','缩成一件十分钟能干完的小事，输入只有一份资料'],['新对话里它不照你的规矩做','回到保存 skill 那一步，让它把你纠正过的点写进 skill 的规矩里，再试'],['手机上说了没反应','先确认 skill 已装进 Hermes 并重启过，再按 01 节的方法查 Hermes 是否在运行'],['不想拿客户的真实信息练','先用示例客户表单练，课后再换真的'],['担心它把客户信息发出去','给 skill 加上[[只整理，不发送，也不登录别的系统]]这条规矩']],
   done:['有一份你认可的标准结果','新开对话并换一份客户表单后，skill 也能按你的规矩做出正确结果','在手机上说[[今日回访名单]]，电脑完成这件事并把结果发回手机'],
   notes:[{h:'时间怎么分（共 60 分钟）',t:['讲师讲三步方法，5 分钟。','学员教它干活，20 分钟。','保存 skill，10 分钟。换资料复测，10 分钟。','装给 AI 员工并用手机触发，15 分钟。']},{h:'课前准备',t:['D2 上午 02 已让 AI 员工上岗。','客户表单能导出（D1 下午 02 建的）。']},{h:'可以讲的几句话',t:['还是 D1 上午那句话：基于什么，帮我做什么，给谁用，做完怎么检查。','先教，再存，换资料再试。','教到你满意，它才学得会。','会了这一招，什么活都能交出去。']},{h:'现场常见情况',t:['学员自己的客户表这时只有几条测试记录，练不出东西，所以默认用示例客户表单。']},{h:'参考',t:['10-05 命令行实测中，默认例子从初稿、纠正到保存都完成，换第二份客户表单再做，结果正确。','方法对应「AI 入门」频道第 2、4、5 关，内容是指挥它改、立规矩、验收。','第 5 关的卡还在补，手机触发也要等 Hermes 实测后补。','对应结营 08 后半段（手机一句话干完）和「送：自己的 skill」。']}]}},
  {id:'e4',no:'04',step:'6',t:'实战部署并上线自己的项目',poster:'实战部署并上线自己的项目 —— 完成核心项目部署上线，并掌握后续复制方法',do:'让 Codex 把官网和小工具上传到 GitHub，用手机提交一次客户表单，并学会修改内容后重新上传。',who:'柳',time:'11:30–12:10',body:{
   quick:['说[[帮我把官网和小工具发布到网上，把网址发我]]','等 1–3 分钟，拿到网址','手机关掉 Wi-Fi，用流量打开','在官网提交一次客户表单','打开客户表查看「测试」记录'],
   why:['官网和小工具只在你自己的电脑上，客户还打不开。','上传到 GitHub 后，你会拿到一个网址，发给谁都能打开。'],
   reveal:[['「上传到 GitHub」到底是什么？','Codex 把「发布」文件夹整个传上去，也会把原网站和这次项目分开。以后改了内容再上传一次，网址不变，内容会更新。'],['为什么要关 Wi-Fi 测？','你家网络能打开，不代表客户能打开。用手机流量打开一次，才算真的放到网上。'],['小程序为什么不上线？','小程序正式上架要企业认证，还要审核和备案。至少要一两周，课上做不完，今天只用测试号在自己手机预览。'],['老板常问：要钱吗？','不要钱，GitHub 免费，也不用买服务器。'],['老板常问：别人能改我的网站吗？','不能。只有登录了你 GitHub 账号的电脑能上传。'],['老板常问：能换成我自己的域名吗？','能，课后再绑定。想让国内访问更稳，可以课后迁到国内服务器并备案。']],
   say:['帮我把官网和小工具发布到网上，把网址发我。','手机打不开，帮我看看。','招牌套餐改成 178 元，改到官网上，再上传一次。','我原来在 GitHub 上有个网站，别动它。'],
   steps:[{n:'确认登录',h:'确认 GitHub 已登录',t:'对应课前准备 0.4。登录那一下由学员自己点。'},{n:'上传项目',h:'说[[帮我把官网和小工具发布到网上，把网址发我]]',t:'Codex 会自己上传官网和小工具的网页版，你不用手动传。它不传企业档案和客户表。',shot:'Codex 在上传'},{n:'拿到网址',h:'等 Codex 发来网址',t:'等 1–3 分钟。网址格式是 https://你的用户名.github.io/品牌名/。',shot:'拿到网址'},{n:'手机打开',h:'手机关掉 Wi-Fi，用流量打开',t:'官网能正常打开，按钮也能点动。',shot:'手机打开官网'},{n:'当一回客户',h:'在官网提交一次测试',t:'点「算算套餐预算」，这就是你下午做的小工具。选人数后点「计算」，再点「打开客户表单」，名字填「测试」，留个电话后提交。',shot:'在手机上提交一次'},{n:'查看记录',h:'打开你的客户表',t:'看到刚才那条「测试」，说明客户看官网后留下了电话。',shot:'客户表里的测试记录'},{n:'修改价格',h:'改完企业档案，再上传官网',t:'比如对 AI 说[[招牌套餐改成 178 元，改到官网上，再上传一次]]。一两分钟后刷新网址，价格会更新，网址不变。',shot:'改完再上传'}],
   pits:[['它说 GitHub 没登录','叫助教协助登录，登录那一下你自己点。'],['等了 5 分钟还打不开','让它查一下，网址最后要带「/品牌名/」。'],['它要动你原来的网站','马上点「停止」，并说[[别动原来的，另开一个]]。'],['手机用流量打不开','换个运营商的手机试，仍不行就用主办方的备用网址。'],['客户表里没看到那条','看看小工具最后的表单，是不是你自己那份。'],['想用自己的域名','课后再绑定自己的域名。']],
   done:['手机用流量能打开你的官网和小工具','提交的「测试」出现在你的客户表里','把「招牌套餐」改成 178 元后，刷新官网能看到新价格'],
   notes:[{h:'时间怎么分（共 40 分钟）',t:['讲师说明 3 分钟。上传官网和小工具 10 分钟。','手机用流量打开官网 10 分钟。','提交测试并查看客户表 7 分钟。','修改价格再上传 10 分钟。']},{h:'课前准备',t:['课前登录过 GitHub。','官网和小工具已经完成。','客户表单已经能提交到客户表。']},{h:'现场常见情况',t:['GitHub 传不上去时，用主办方服务器的二级域名。']},{h:'参考',t:['10-05 实测中，命令行和桌面版都上线成功，还发现会覆盖已有个人网站，skill 已改成另开一个，个人网站没被动。','对应结营 01、02、03：改价格网上跟着变，手机能打开，提交进了客户表。']}]}}]},
 {id:'d2pm',icon:'2下',name:'D2 下午 · 企业工作流与数字人',full:'DAY 2 下午｜企业 AI 工作流与数字人实战',goal:'下午结束：一个真实、有内容、具备流量潜力的数字人作品',items:[
  {id:'f1',no:'01',step:'14',t:'感受完整的企业 AI 工作流',poster:'感受完整的企业 AI 工作流 —— 打通选题、文案、内容生产与投流分析',fix:'投流分析现场不做',do:'先看讲师 10 分钟演示完整流程，再做 7 个选题、60 秒口播稿和竖版封面，口播稿留到下午拍数字人。',who:'柳 + 悦姐',time:'13:30–14:10',body:{
   quick:['看讲师 10 分钟演示完整流程','说[[基于企业档案，给我 7 个短视频选题]]','挑 1 个，写 60 秒口播稿','让 Codex 生成竖版封面','口播稿留到下午拍数字人'],
   why:['先看 AI 怎么参与内容生产，你才知道每一步能交给 AI 什么，自己决定用不用。','亲手做出选题、口播稿和封面，下午拍数字人时才有素材可用。'],
   say:['基于企业档案，给我 7 个短视频选题，每个写清为什么拍、开头 3 秒说什么。','我选第 2 个，写成 60 秒口播稿，语气像跟熟客聊天。','这段太书面了，改得口语一点。','给这条视频做一张竖版封面，不要文字。'],
   steps:[{n:'看完整演示',h:'先看讲师完整演示',t:'讲师提前做好一条完整短视频，10 分钟给你看。内容包括看数据、选题、口播稿、数字人、ChatCut 剪辑和封面，每一步都看 AI 做了什么、老板做了什么决定。',shot:'全流程一页图'},{n:'生成选题',h:'说[[基于企业档案，给我 7 个短视频选题]]',t:'它按企业档案给出 7 个选题。每个选题都写清为什么要拍、开头 3 秒说什么。',shot:'7 个选题'},{n:'写口播稿',h:'挑 1 个，写 60 秒口播稿',t:'挑一个最想拍的，告诉它编号。它写一段约 60 秒的口播稿，事实只用企业档案里的。',shot:'口播稿'},{n:'自己试念',h:'自己念一遍，标出拗口处',t:'哪句拗口或太书面，就直接说改哪一句。'},{n:'做竖版封面',h:'让 Codex 生成竖版封面',t:'标题后期再加。',shot:'竖版封面'},{n:'保存素材',h:'把口播稿和封面存好',t:'放进工作区的「内容」文件夹。下午拍数字人直接用。'}],
   pits:[['它出的选题很空，像别人家的','说[[只用企业档案里的产品和客户常问的问题出选题]]'],['口播稿里有企业档案没有的优惠','删掉后说[[不许写企业档案里没有的优惠和承诺]]'],['稿子太长，念起来超过 1 分钟','说[[压到 250 字左右]]'],['封面里出现乱码文字','说[[封面不要任何文字]]']],
   done:['7 个选题已经列出，并挑定了 1 个','有一段自己念着顺口的 60 秒口播稿','有一张竖版封面'],
   notes:[{h:'时间怎么分（共 40 分钟）',t:['讲师演示全流程，10 分钟。','选题，10 分钟。','口播稿，12 分钟。','封面 5 分钟，完成后收尾 3 分钟。']},{h:'课前准备',t:['讲师提前一天把同一个演示公司的完整素材做好。','从数据到成片的每一步都留截图或录屏。']},{h:'参考',t:['前面一天半做的是「门面」和「工具」，这一节进入内容生产。','10-05 命令行实测：生成 7 个选题并选第 2 个，得到 257 字口播稿和 9:16 封面。','新开对话也能接着做。','对应结营 09：一篇口播稿。']}]}},
  {id:'f2',no:'02',step:'13',t:'搭建自己的 AI 分析助手',poster:'搭建自己的 AI 分析助手 —— 辅助分析账号、用户、选题与短视频内容方向',do:'用账号数据或示例数据生成分析，对照上一节选题，再保存成自己的「每周复盘」skill。',who:'柳',time:'14:10–14:50',body:{
   verify:'「存成每周复盘 skill」这一步还没实测。',
   quick:['导出近 30 天作品数据','说[[基于这份数据，帮我分析一下账号]]，看 3 个带数字的发现','用数据核对上一节的选题','保存「每周复盘」skill','用新数据测试「每周复盘」skill'],
   why:['大多数老板发视频凭感觉，发完也不看数据。','AI 会找出内容表现、互动情况和发布时间，再按你的方法生成每周报告。'],
   say:['基于这份数据，帮我分析一下账号：哪类内容播放高，下一条拍什么。','这是我导出的数据，我把文件拖进来了。','这个发现能再具体一点，告诉我是哪几条视频？','照这个分析，上一节的选题要换吗？','把刚才的分析做成我的 skill，名字叫「每周复盘」。','新对话里就说：每周复盘，用这份新的数据。'],
   steps:[{n:'导数据',h:'导出近 30 天作品数据',t:'从抖音、视频号或小红书的「创作者后台」导出作品数据表。'},{n:'放文件',h:'把数据文件放进「内容」文件夹',t:'拖进工作区的「内容」文件夹，再说[[基于这份数据，帮我分析一下账号]]。'},{n:'看分析',h:'查看分析报告',t:'报告有一句话结论和 3 个发现，每个发现都带数字。例如晚间发的平均播放最高。用示例数据时，报告会写明「这不是你真实账号的结论」。',shot:'分析报告'},{n:'核选题',h:'用数据核对上一节的选题',t:'把上一节的选题和数据放在一起看，记下数据支不支持。'},{n:'保存技能',h:'把分析方法保存成「每周复盘」skill',t:'照上午的方法，对 Codex 说[[把刚才的分析做成我的 skill，名字叫每周复盘]]。它会把你认可的分析方法写成 skill。',shot:'每周复盘 skill'},{n:'再测试',h:'在新对话里测试「每周复盘」skill',t:'说[[每周复盘，用这份新的数据]]，它照样出报告，说明保存成功。想在手机上用，就让它把「每周复盘」skill 装给 AI 员工，装好后手机上说一句话也能出。',shot:'新对话里出报告'}],
   pits:[['没有账号或导不出数据','先用课上发的示例数据练方法，不会导出就问助教。'],['数据太少，只有几条','样本太少时别下结论，让它写[[仅供参考，继续观察]]。'],['它把可能的原因说成了肯定的结论','对它说[[把看到的和猜测的分开写，再补上下次怎么验证]]。'],['数据不支持上一节的选题','换一个选题。想保留也行，就当成一次测试。'],['新对话里报告格式变了','回到第 5 步，让它把输出格式写进 skill 里。']],
   done:['分析里有 3 个带数字的发现','你自己的「每周复盘」skill 换一份数据也能出报告','下周你能导出数据，再对 AI 说[[每周复盘，用这份新的数据]]'],
   notes:[{h:'时间怎么分（共 40 分钟）',t:['讲 3 分钟，导数据 7 分钟。','出分析 10 分钟。','对照选题 5 分钟。','保存并复测 15 分钟。']},{h:'可以讲的几句话',t:['这是当天第二次练「举一反三」，要点破：「上午那三步，这里又用了一遍」。']},{h:'课间安排',t:['茶歇，请悦姐在 14:50 数字人开始前后排 10 分钟。']},{h:'参考',t:['10-05 命令行实测，8 条示例数据，分析结果带数字，并写明不是真实结论，用时约 5.5 分钟。','「每周复盘」skill 还没实测。','对应结营 09：一份账号分析。']},{h:'要补的引导',t:['第 13 步还缺「每周复盘」skill 的引导。']}]}},
  {id:'f3',no:'03',t:'数字人带练',fix:'海报写「媛姐」，就是悦姐，海报定稿时改字',poster:'媛姐带练数字人应用 —— 从数字人逻辑到现场实操，提升短视频生产效率',do:'悦姐带练，内容悦姐定',who:'悦姐',time:'14:50–17:00（03、04 同时进行，悦姐定）'},
  {id:'f4',no:'04',t:'现场完成数字人拍摄与制作',poster:'现场完成数字人拍摄与制作 —— 把真实人设、内容表达和 AI 能力结合起来',do:'3 个拍摄位轮流拍，用 01 写好的口播稿；排队的人先补做前面没完成的节',who:'悦姐',time:'14:50–17:00（03、04 同时进行，悦姐定）'}]},

/* ================= 检索（演示：中文双字 + 关键词，模拟向量检索） ================= */
const TH=0.3;
const STOP=new Set(['怎么','什么','一个','这个','那个','是不','不是','可以','我们','你们','就是','的话','能不','不能','有没','没有','一下','如何','我的','你的']);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9一-龥]/g,'');
function grams(s){
  const g=new Set(),low=s.toLowerCase();
  (low.match(/[a-z0-9]+/g)||[]).forEach(w=>{if(w!=='ai'&&w.length>1)g.add(w)});
  (low.match(/[一-龥]+/g)||[]).forEach(run=>{
    if(run.length===1){if(!STOP.has(run))g.add(run);return}
    for(let i=0;i<run.length-1;i++){const b=run.slice(i,i+2);if(!STOP.has(b))g.add(b)}
  });
  return g;
}
CARDS.forEach(c=>{c._g=grams([c.q,...c.ask,...c.kw].join('，'))});
GAPS.forEach(g=>{g._g=grams(g.q)});
function score(q,c){
  const qg=grams(q);if(!qg.size)return 0;
  let hit=0;qg.forEach(x=>{if(c._g.has(x))hit++});
  const nq=norm(q);let bonus=0;
  c.kw.forEach(k=>{if(nq.includes(norm(k)))bonus+=0.22});
  return hit/qg.size*0.85+Math.min(bonus,0.45);
}

function linkTerms(){
  if(S.chan!=='b'||S.cview.type!=='citem')return;
  const root=document.querySelector('#reader .inner');if(!root)return;
  const keys=[];GLOSS.forEach(g=>[g.k,...g.a].forEach(x=>keys.push([x,g.k])));
  keys.sort((a,b)=>b[0].length-a[0].length);
  const re=new RegExp(keys.map(x=>x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'));
  const map=Object.fromEntries(keys),done=new Set();
  const skip='.tag,.sh,h1,h2,h3,button,a,.verbar,.crumb,.meta,figure,pre,summary,.quote,.jsc,.secnav,.navrow,.posterbox';
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest(skip)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(let node of nodes){
    let guard=0;
    while(node&&guard++<20){
      const txt=node.nodeValue;let m=null,idx=-1;
      const r2=new RegExp(re.source,'g');let mm;
      while((mm=r2.exec(txt))){if(!done.has(map[mm[0]])){m=mm[0];idx=mm.index;break}}
      if(!m)break;
      done.add(map[m]);
      const after=node.splitText(idx);const rest=after.splitText(m.length);
      const a=document.createElement('a');a.className='gl';a.dataset.gl=map[m];a.textContent=m;
      after.parentNode.replaceChild(a,after);node=rest;
    }
  }
}

  renderTree();renderReader();renderProg();updateCtx();

/* ================= 聊天 ================= */
const msgs=$('#msgs');
const scrollDown=()=>{msgs.scrollTop=msgs.scrollHeight};
function addMsg(who,html){const d=document.createElement('div');d.className='msg '+who;d.innerHTML=html;msgs.appendChild(d);scrollDown();return d}
function userSay(t){addMsg('me',`<div class="bubble">${esc(t)}</div>`)}
async function typeInto(el,text){
  for(let i=0;i<text.length;i++){el.textContent+=text[i];if(i%2===0){scrollDown();await sleep(14)}}
}
// lines: 字符串，或 [加粗标签, 正文]
async function botSay(lines,acts,pre=''){
  S.busy=true;
  const t=addMsg('bot','<div class="bubble typing"><i></i><i></i><i></i></div>');
  await sleep(550);t.remove();
  const r=addMsg('bot',`${pre}<div class="bubble">${lines.map(()=>'<p></p>').join('')}</div>`);
  const ps=r.querySelectorAll('.bubble p');
  for(let i=0;i<lines.length;i++){
    const L=lines[i];
    if(Array.isArray(L)){ps[i].innerHTML=`<b>${L[0]}</b><span></span>`;await typeInto(ps[i].lastChild,L[1])}
    else await typeInto(ps[i],L);
    await sleep(120);
  }
  if(acts&&acts.length){
    const d=document.createElement('div');d.className='acts';
    d.innerHTML=acts.map(([k,txt,cls])=>`<button class="act-btn ${cls||''}" data-do="${k}">${txt}</button>`).join('');
    r.appendChild(d);
  }
  scrollDown();S.busy=false;return r;
}
const guideActs=()=>[['next','看完了，下一步','primary'],['skip','这节我会了，跳过'],['askq','我有个问题']];

function setMode(m){S.mode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m))}

function logGap(q){
  const nq=norm(q),qg=grams(q);
  GAPS.forEach(g=>g.fresh=false);
  const m=GAPS.find(g=>{
    if(g.kw&&g.kw.filter(k=>nq.includes(norm(k))).length>=2)return true;
    let hit=0;qg.forEach(x=>{if(g._g.has(x))hit++});
    return qg.size&&hit/qg.size>=0.5;
  });
  let n=1;
  if(m){m.n++;m.fresh=true;n=m.n}else GAPS.push({q,n:1,src:'学员提问 · 知识库没找到',_g:qg,fresh:true});
  renderTree();if(S.view.type==='gap')renderReader();
  const b=$('#gapbadge');b&&b.classList.add('pulse');
  return n;
}

async function explain(c){
  openView({type:'card',id:c.id});
  await botSay(['换个说法讲。',['打个比方：',c.ana],['说白了就一句：',c.say.split('。')[0]+'。'],['你先做这一步：',c.act],'做完回来跟我说，咱们看看效果。']);
}

async function ask(q){
  q=String(q).trim();if(!q||S.busy)return;
  userSay(q);$('#inp').value='';$('#topq').value='';
  const m=q.match(/^这一节我没太懂：(.+)$/);
  if(m){const c=CARDS.find(x=>x.q===m[1]);if(c)return explain(c)}

  const ctxId=S.view.type==='card'?S.view.id:null;
  const ranked=CARDS.map(c=>({c,s:score(q,c)+(c.id===ctxId?0.08:0)})).sort((a,b)=>b.s-a.s);
  const top=ranked.filter(r=>r.s>=TH).slice(0,2);

  if(!top.length){
    const n=logGap(q);
    await botSay(['这个问题我的知识库里还没有，我不瞎编。',
      '已经记进待补清单了，杰哥下场直播亲自答，答完整理成卡，下回你再问我就会了。'+(n>1?'这个问题已经有 '+n+' 个人问过了，会优先补。':'')],
      [['gap','看看待补清单']],
      `<div class="retr miss">🔍 翻遍了知识库，没找到能回答这个问题的卡</div>`);
    return;
  }
  const c=top[0].c;
  openView({type:'card',id:c.id},{fromBot:true});
  const pre=`<div class="retr">🔍 翻了知识库，找到 ${top.length} 张相关的卡${top.map(x=>`<button class="hit" data-card="${x.c.id}"><span>📇 ${x.c.q}</span><em>匹配 ${Math.round(Math.min(x.s,0.97)*100)}%</em></button>`).join('')}</div>`;
  const where=c.lv===2?'这正好是你现在这一关要练的，':'这一节在'+lvName(c.lv)+'，';
  await botSay([c.say,['打个比方：',c.ana],['你现在就做一件事：',c.act],where+'已经在中间给你打开了，完整的看那儿。'],
    top[1]?[['open:'+top[1].c.id,'也看看：'+top[1].c.q]]:null,pre);
}

async function doAction(a,btn){
  if(a==='home')return openView({type:'home'});
  if(a==='gap')return openView({type:'gap'});
  if(a.startsWith('open:'))return openView({type:'card',id:a.slice(5)},{fromBot:true});
  if(S.busy)return;
  if(btn&&btn.closest('.acts'))btn.closest('.acts').querySelectorAll('button').forEach(b=>b.disabled=true);

  if(a==='start-guide'){
    setMode('guide');userSay('跟着你一步步走');
    const id=PATH[S.pi];openView({type:'card',id},{fromBot:true});
    return botSay(['好，按你的水平，从第 2 关「指挥它改」开始。中间已经打开了第一节：《'+card(id).q+'》。','看完点下面的按钮。会的直接跳过，不用每节都看。'],guideActs());
  }
  if(a==='free'){
    setMode('free');userSay('我自己翻');
    return botSay(['行，左边目录随便点，不锁关。','你打开哪一节我都知道，卡住了直接问，我把你带到对应的地方。']);
  }
  if(a==='askq'){$('#inp').focus();return botSay(['说吧，用你自己的话问。'])}
  if(a==='next'||a==='skip'){
    userSay(a==='next'?'看完了，下一步':'这节我会了，跳过');
    const cur=PATH[S.pi],nid=PATH[S.pi+1];
    if(!nid)return botSay(['知识库里的卡都过了一遍。接下来去第 6 关：自己挑一件新活，做完拿给我看。']);
    const crossed=card(nid).lv!==card(cur).lv;
    openView({type:'card',id:nid},{fromBot:true});
    const lines=[];
    if(crossed)lines.push(lvName(card(cur).lv)+'的内容过完了，接下来是'+lvName(card(nid).lv)+'。');
    lines.push((a==='skip'?'行，跳过。':'好。')+'下一节：《'+card(nid).q+'》，已经在中间打开了。');
    return botSay(lines,guideActs());
  }
  if(a==='done-step'){
    if(S.view.type!=='card')return;
    const c=card(S.view.id);
    userSay('「马上动手」那一步我做完了');
    const first=[2,3,4].includes(c.lv)&&!S.did.has(c.lv);
    S.did.add(c.lv);renderProg();
    const lines=['好样的，做了才算数。改了几轮？最后满不满意？把结果截个图发我看看。（演示版还没接图片）'];
    if(first)lines.push(lvName(c.lv)+'，点亮「'+lvl(c.lv).badge+'」。');
    return botSay(lines,S.mode==='guide'?[['next','下一步','primary']]:null);
  }
}

/* ================= 事件 ================= */
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('tocopen')});
document.addEventListener('click',e=>{
  if(document.body.classList.contains('tocopen')&&!e.target.closest('#tree,#tocbtn,#tocbar'))document.body.classList.remove('tocopen');
  const t=e.target.closest('[data-gl],[data-back],#tocbar,#tocbtn,[data-ctog],[data-goto],[data-ver],[data-chan],[data-copy],[data-cdo],[data-cblock],[data-citem],[data-mode],[data-do],[data-ask],[data-card],[data-ch]');if(!t)return;
  if(t.disabled)return;
  if(t.dataset.chan){if(S.chan!==t.dataset.chan)setChan(t.dataset.chan);return}
  if(t.dataset.ver){S.ver=t.dataset.ver;history.replaceState(null,'',campHash());renderTree();renderReader();fillJunshi();spy();return}
  if(t.dataset.goto){goSec(t.dataset.goto);return}
  if(t.dataset.gl){S.back={view:S.cview,top:$('#reader').scrollTop,win:window.scrollY};openC({type:'gloss'});const el=document.getElementById(glId(t.dataset.gl));if(el){el.scrollIntoView({block:'start'});el.classList.add('flash')}return}
  if(t.dataset.back){const b=S.back;S.back=null;openC(b.view);$('#reader').scrollTop=b.top;window.scrollTo(0,b.win);spy();return}
  if(t.dataset.ctog){e.stopPropagation();const id=t.dataset.ctog;S.closed.has(id)?S.closed.delete(id):S.closed.add(id);renderTree();spy();return}
  if(t.id==='tocbar'||t.id==='tocbtn'){document.body.classList.toggle('tocopen');return}
  if(t.dataset.copy!==undefined){const o=t.textContent;(navigator.clipboard?navigator.clipboard.writeText(t.dataset.copy):Promise.reject()).then(()=>{t.textContent='已复制 ✓';setTimeout(()=>t.textContent=o,1200)}).catch(()=>{});return}
  if(t.dataset.cdo)return openC({type:t.dataset.cdo});
  if(t.dataset.cblock){S.closed.delete(t.dataset.cblock);return openC({type:'cblock',id:t.dataset.cblock})}
  if(t.dataset.citem)return openC({type:'citem',id:t.dataset.citem});
  if(t.dataset.mode){if(S.mode!==t.dataset.mode)doAction(t.dataset.mode==='guide'?'start-guide':'free');return}
  if(t.dataset.do)return doAction(t.dataset.do,t);
  if(t.dataset.ask)return ask(t.dataset.ask);
  if(t.dataset.card)return openView({type:'card',id:t.dataset.card},{fromBot:!!t.closest('#msgs')});
  if(t.dataset.ch!==undefined)return openView({type:'ch',id:+t.dataset.ch});
});
